blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: damru / st0o0
  domain: automation
  name: Ikea's Rodret, Somrig or Tradfri ⚙️ Controls
  description: |
    ## ⚙️ IKEA RODRET / SOMRIG / TRADFRI – Universal Remote Control for Home Assistant

    Assign **any Home Assistant action** to every button of the **IKEA RODRET (E2201)**,
    **SOMRIG (E2213)**, or **TRADFRI ON/OFF (E1743)** remotes via Zigbee2MQTT.
    Full flexibility for single press, double press, and hold.

    ---

    ### 🧠 Features
    - 🎯 **Custom actions** for every button event (press, hold, double press)
    - ⏩ **Double press** — native on SOMRIG, virtual on RODRET/TRADFRI
    - 🔁 **Hold repeat** with adjustable delay and max loop count
    - 📱 Supports **multiple remotes** controlling the same targets

    ---

    ### 🎛️ Button Layout

    | Button | Single Press | Double Press | Hold |
    |:-------|:-------------|:------------|:-----|
    | 🔼 **ON** (Rodret/Tradfri) · **1 dot** (Somrig) | Custom action | Custom action (optional) | Custom action (repeated) |
    | 🔽 **OFF** (Rodret/Tradfri) · **2 dots** (Somrig) | Custom action | Custom action (optional) | Custom action (repeated) |

    ---

    ### ⚙️ Compatibility
    - 🧩 **Integration:** Zigbee2MQTT (`integration: mqtt`)
    - 💬 Not compatible with ZHA
    - Supports **RODRET** (E2201), **SOMRIG** (E2213), and **TRADFRI ON/OFF** (E1743)

    ---

    ### 💡 Double Press Notes
    - **SOMRIG:** Native double press support via Zigbee2MQTT
    - **RODRET / TRADFRI:** Virtual double press via timing detection — enable
      **Expose double press** and configure the **Double press delay**

    ---

    ✨ Created by **damru / st0o0**
  input:
    remote_devices:
      name: 📱 Remotes
      description: >
        One or more IKEA remotes (RODRET, SOMRIG, or TRADFRI ON/OFF) paired via Zigbee2MQTT.
      default: []
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: IKEA
              model: RODRET wireless dimmer/power switch
            - integration: mqtt
              manufacturer: IKEA
              model: SOMRIG shortcut button
            - integration: mqtt
              manufacturer: IKEA
              model: TRADFRI on/off switch
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: RODRET wireless dimmer/power switch (E2201)
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: SOMRIG shortcut button (E2213)
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: TRADFRI on/off switch (E1743)
          multiple: true
    on_press_action:
      name: 🔼 Press ON / 1 dot action
      description: Action(s) to run when the **ON** (Rodret/Tradfri) or **1 dot** (Somrig) button is **pressed**.
      default: []
      selector:
        action: {}
    off_press_action:
      name: 🔽 Press OFF / 2 dots action
      description: Action(s) to run when the **OFF** (Rodret/Tradfri) or **2 dots** (Somrig) button is **pressed**.
      default: []
      selector:
        action: {}
    on_hold_action:
      name: 🔼 Hold ON / 1 dot action
      description: Action(s) to run repeatedly when the **ON** (Rodret/Tradfri) or **1 dot** (Somrig) button is **held**.
      default: []
      selector:
        action: {}
    off_hold_action:
      name: 🔽 Hold OFF / 2 dots action
      description: Action(s) to run repeatedly when the **OFF** (Rodret/Tradfri) or **2 dots** (Somrig) button is **held**.
      default: []
      selector:
        action: {}
    on_double_press_action:
      name: ⏩ Double press ON / 1 dot action
      description: >
        Action(s) to run when the **ON** (Rodret/Tradfri) or **1 dot** (Somrig) button is **pressed twice**.
        For Rodret/Tradfri: requires **Expose double press ON** to be enabled.
      default: []
      selector:
        action: {}
    off_double_press_action:
      name: ⏩ Double press OFF / 2 dots action
      description: >
        Action(s) to run when the **OFF** (Rodret/Tradfri) or **2 dots** (Somrig) button is **pressed twice**.
        For Rodret/Tradfri: requires **Expose double press OFF** to be enabled.
      default: []
      selector:
        action: {}
    helper_section:
      name: ⏱️ Timing
      icon: mdi:cog-outline
      collapsed: true
      input:
        helper_hold_delay:
          name: Hold delay
          description: >
            Time between repeated actions while a button is held down.
            Lower values give faster response, higher values give more control.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_max_loops:
          name: Max hold loops
          description: >
            Maximum number of action repetitions while holding a button.
            Prevents infinite loops if button release is not detected.
          default: 20
          selector:
            number:
              min: 1.0
              max: 1000.0
              step: 1.0
              mode: slider
    rodret_tradfri_options_section:
      name: 🔄 Double press options (Rodret/Tradfri only)
      icon: mdi:remote
      collapsed: true
      input:
        on_double_press_exposed:
          name: Expose double press ON
          description: >
            Enable virtual **double press** detection for the **ON** button.
            Only needed for Rodret/Tradfri — SOMRIG has native double press.
            Adds a small delay to single press detection.
          default: false
          selector:
            boolean: {}
        off_double_press_exposed:
          name: Expose double press OFF
          description: >
            Enable virtual **double press** detection for the **OFF** button.
            Only needed for Rodret/Tradfri — SOMRIG has native double press.
            Adds a small delay to single press detection.
          default: false
          selector:
            boolean: {}
        helper_double_press_delay:
          name: Double press delay
          description: >
            Maximum time between first and second press for double press detection.
            Increase if double press is not detected reliably.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
mode: restart
max_exceeded: silent
triggers:
  # RODRET (E2201) + TRADFRI (E1743)
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "on"
    id: press-on-z2m-e1743-e2201
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "off"
    id: press-off-z2m-e1743-e2201
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_up
    id: hold-on-z2m-e1743-e2201
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_down
    id: hold-off-z2m-e1743-e2201
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_stop
    id: release-z2m-e1743-e2201

  # SOMRIG (E2213)
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 1_short_release
    id: press-dots1-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 2_short_release
    id: press-dots2-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 1_double_press
    id: double-press-dots1-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 2_double_press
    id: double-press-dots2-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 1_long_press
    id: hold-dots1-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 2_long_press
    id: hold-dots2-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 1_long_release
    id: release-hold-dots1-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 2_long_release
    id: release-hold-dots2-z2m-e2213
variables:
  is_mqtt: "{{ trigger.platform == 'mqtt' }}"
  mqtt_topic: "{{ trigger.topic }}"
  on_double_press_exposed: !input on_double_press_exposed
  off_double_press_exposed: !input off_double_press_exposed
  remote_devices: !input remote_devices
  remote_devices_names: "{{ remote_devices | map('device_attr', 'name') | map('regex_replace', find='^.*/', replace='', ignorecase=False) | list }}"
condition:
  - condition: template
    value_template: >-
      {{
        (trigger.topic.split('/')[2] in remote_devices_names if is_mqtt)
      }}
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - press-on-z2m-e1743-e2201
              - press-dots1-z2m-e2213
        sequence:
          - if:
              - condition: template
                value_template: "{{ on_double_press_exposed }}"
            then:
              - choose:
                  - conditions:
                      - condition: trigger
                        id:
                          - press-on-z2m-e1743-e2201
                    sequence:
                      - wait_for_trigger:
                          - trigger: mqtt
                            topic: "{{ mqtt_topic }}"
                            payload: "on"
                        timeout:
                          milliseconds: !input helper_double_press_delay
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: "{{ wait.trigger.idx is defined }}"
                        then: !input on_double_press_action
                        else: !input on_press_action
                default: !input on_press_action
            else: !input on_press_action
      - conditions:
          - condition: trigger
            id:
              - press-off-z2m-e1743-e2201
              - press-dots2-z2m-e2213
        sequence:
          - if:
              - condition: template
                value_template: "{{ off_double_press_exposed }}"
            then:
              - choose:
                  - conditions:
                      - condition: trigger
                        id:
                          - press-off-z2m-e1743-e2201
                    sequence:
                      - wait_for_trigger:
                          - trigger: mqtt
                            topic: "{{ mqtt_topic }}"
                            payload: "off"
                        timeout:
                          milliseconds: !input helper_double_press_delay
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: "{{ wait.trigger.idx is defined }}"
                        then: !input off_double_press_action
                        else: !input off_press_action
                default: !input off_press_action
            else: !input off_press_action
      - conditions:
          - condition: trigger
            id:
              - double-press-dots1-z2m-e2213
        sequence: !input on_double_press_action
      - conditions:
          - condition: trigger
            id:
              - double-press-dots2-z2m-e2213
        sequence: !input off_double_press_action
      #
      # Actions for up button long press
      - conditions:
          - condition: trigger
            id:
              - hold-on-z2m-e1743-e2201
              - hold-dots1-z2m-e2213
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence: !input on_hold_action
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-on-z2m-e1743-e2201
                                    - hold-dots1-z2m-e2213
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "1_long_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      - conditions:
          - condition: trigger
            id:
              - hold-off-z2m-e1743-e2201
              - hold-dots2-z2m-e2213
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence: !input off_hold_action
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-off-z2m-e1743-e2201
                                    - hold-dots2-z2m-e2213
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "2_long_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
