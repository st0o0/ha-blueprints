blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: "\U0001F3C3 ha-njord Activity Window Finder"
  description: |
    ## 🏃 Activity Window Finder for ha-njord

    Morning advisory for outdoor activities — tells you if conditions are
    good for running or cycling today. Create one automation per activity.
    Powered by `ha-njord`'s activity index sensors.

    ---

    ### 🧠 Features
    - 📊 Monitors `sensor.*_running_index` or `sensor.*_cycling_index`
    - ☀️ Morning check at configurable time
    - 🌧️ Optional rain guard via `sensor.*_weather_trend`
    - 🌬️ Includes weather context (wind, temperature) from sensor attributes
    - 🔔 Single notification per location — updates in place via stable tag
    - 💤 Snooze button to mute notifications
    - 📱 "Details" and "Snooze" action buttons

    ---

    ### ⚙️ Requirements
    - 🧩 **Integration:** `ha-njord`
    - 📲 Home Assistant Companion App (for actionable notifications)
    - 💾 An `input_text` helper (only if you enable Snooze) — create one under
      **Settings → Devices & Services → Helpers → Text**. Can be shared with
      other ha-njord blueprints.

    ---

    ✨ Created by **st0o0**

  input:
    activity_sensor:
      name: "\U0001F3C3 Activity Index Sensor"
      description: >
        The `ha-njord` activity index sensor — select `running_index`
        or `cycling_index` (e.g. `sensor.home_running_index`).
        Create a separate automation for each activity type.
      selector:
        entity:
          filter:
            domain: sensor
            integration: njord

    notify_target:
      name: "\U0001F4F1 Notify service"
      description: >
        The notification service/target to send alerts to
        (e.g. `notify.mobile_app_your_phone`).
      selector:
        text: {}

    threshold_section:
      name: "\U0001F4CF Thresholds"
      icon: mdi:tune
      collapsed: true
      input:
        min_index:
          name: Minimum activity index
          description: >
            Notify only when the activity index is at or above this value.
          default: 60
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    timing_section:
      name: "⏰ Timing"
      icon: mdi:clock-outline
      collapsed: true
      input:
        check_time:
          name: Morning check time
          description: Time of day for the morning activity advisory.
          default: "07:00:00"
          selector:
            time: {}

    weather_section:
      name: "\U0001F327 Rain guard (optional)"
      icon: mdi:weather-rainy
      collapsed: true
      input:
        weather_trend_sensor:
          name: Weather Trend Sensor
          description: >
            Optional `ha-njord` weather trend sensor for rain guard.
            If configured, no advisory is sent when rain is imminent.
            Leave empty to skip rain guard.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
                integration: njord
        min_dry_window_hours:
          name: Minimum dry window
          description: >
            Minimum rain-free hours required for a positive advisory.
          default: 2
          selector:
            number:
              min: 1
              max: 12
              step: 1
              unit_of_measurement: hours
              mode: slider

    actions_section:
      name: "\U0001F518 Notification actions"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        dashboard_path:
          name: Details dashboard path
          description: >
            Path opened by the "Details" button (e.g. `/lovelace/weather`).
            Leave empty to hide the Details button.
          default: ""
          selector:
            text: {}
        enable_snooze:
          name: Enable Snooze button
          description: Show a "Snooze" button that mutes notifications for a while.
          default: true
          selector:
            boolean: {}
        snooze_helper:
          name: Snooze storage helper
          description: >
            An `input_text` helper used to store snoozed keys. Required
            when Snooze is enabled. Can be shared with other ha-njord blueprints.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        snooze_hours:
          name: Snooze duration
          description: How many hours notifications stay muted after snooze.
          default: 12
          selector:
            number:
              min: 1
              max: 48
              step: 1
              unit_of_measurement: hours
              mode: slider

mode: parallel
max_exceeded: silent

triggers:
  - trigger: time
    at: !input check_time
    id: morning

variables:
  activity_sensor: !input activity_sensor
  notify_target: !input notify_target
  min_index: !input min_index
  weather_trend_sensor: !input weather_trend_sensor
  min_dry_window_hours: !input min_dry_window_hours
  dashboard_path: !input dashboard_path
  enable_snooze: !input enable_snooze
  snooze_helper: !input snooze_helper
  snooze_hours: !input snooze_hours

  sensor_name: "{{ (activity_sensor | string).split('.')[1] }}"
  location: >-
    {{ sensor_name | regex_replace('_(running|cycling)_index$', '') }}
  activity_type: >-
    {{ 'running' if 'running' in sensor_name else 'cycling' }}
  activity_key: "njord_{{ activity_type }}_{{ location }}"
  activity_emoji: "{{ '🏃' if activity_type == 'running' else '🚴' }}"
  activity_label: "{{ 'Running' if activity_type == 'running' else 'Cycling' }}"

  current_index: "{{ states(activity_sensor) | float(0) }}"
  wind_speed_raw: "{{ state_attr(activity_sensor, 'wind_speed') }}"
  wind_speed: "{{ wind_speed_raw | float(0) | round(1) if wind_speed_raw is not none and wind_speed_raw != '' else none }}"
  temperature_raw: "{{ state_attr(activity_sensor, 'temperature') }}"
  temperature: "{{ temperature_raw | float(0) | round(1) if temperature_raw is not none and temperature_raw != '' else none }}"
  feels_like_raw: "{{ state_attr(activity_sensor, 'feels_like') }}"
  feels_like: "{{ feels_like_raw | float(0) | round(1) if feels_like_raw is not none and feels_like_raw != '' else none }}"

  precip_h_raw: "{{ state_attr(weather_trend_sensor, 'precip_starts_in_hours') if weather_trend_sensor | default('', true) | length > 0 else none }}"
  precip_h: "{{ precip_h_raw | float(99) if precip_h_raw is not none and precip_h_raw != '' else 99 }}"
  has_dry_window: "{{ precip_h | float(99) >= min_dry_window_hours | float(2) }}"

  now_ts: "{{ as_timestamp(now()) }}"
  snooze_raw_state: "{{ (states(snooze_helper) | default('', true)) if (enable_snooze and snooze_helper | default('', true) | length > 0) else '' }}"
  snooze_pairs: >-
    {% set ns = namespace(list=[]) %}
    {% for entry in ((snooze_raw_state | string).split(';') if snooze_raw_state | length > 0 else []) %}
      {% if '=' in entry %}
        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
  is_snoozed: >-
    {{ enable_snooze and (snooze_pairs | selectattr('key', 'eq', activity_key) | selectattr('ts', 'gt', now_ts) | list | length > 0) }}

  action_details: "URI"
  action_snooze: "{{ activity_key | upper }}_SNOOZE_{{ context.id }}"

actions:
  - if:
      - condition: template
        value_template: "{{ current_index | float(0) >= min_index | float(60) and has_dry_window and not is_snoozed }}"
    then:
      - variables:
          notification_title: "{{ activity_emoji }} Good {{ activity_label | lower }} weather ({{ current_index | round }}%)"
          notification_message: >-
            {{ activity_label }} index {{ current_index | round }}%
            {%- if temperature is not none %}, {{ temperature }}°C{% endif %}
            {%- if feels_like is not none %} (feels like {{ feels_like }}°C){% endif %}
            {%- if wind_speed is not none %}, wind {{ wind_speed }} km/h{% endif %}
            {%- if precip_h | float(99) < 99 %}, ~{{ precip_h | round }}h dry{% endif %}
          actions_list: >-
            {% set ns = namespace(list=[]) %}
            {% if dashboard_path | default('', true) | length > 0 %}
              {% set ns.list = ns.list + [{'action': action_details, 'title': 'Details', 'uri': dashboard_path}] %}
            {% endif %}
            {% if enable_snooze and snooze_helper | default('', true) | length > 0 %}
              {% set ns.list = ns.list + [{'action': action_snooze, 'title': 'Snooze ' ~ snooze_hours ~ 'h'}] %}
            {% endif %}
            {{ ns.list }}
      - action: "{{ notify_target }}"
        data:
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"
          data: >-
            {{ {
              'tag': activity_key,
              'actions': actions_list,
              'channel': 'njord_activity',
              'importance': 'default',
              'priority': 'default',
            } }}
      - if:
          - condition: template
            value_template: "{{ enable_snooze and snooze_helper | default('', true) | length > 0 }}"
        then:
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_snooze }}"
            timeout:
              hours: 12
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.trigger is not none }}"
            then:
              - variables:
                  snooze_write_now_ts: "{{ as_timestamp(now()) }}"
                  snooze_write_raw_state: "{{ states(snooze_helper) | default('', true) }}"
                  snooze_write_pairs: >-
                    {% set ns = namespace(list=[]) %}
                    {% for entry in ((snooze_write_raw_state | string).split(';') if snooze_write_raw_state | length > 0 else []) %}
                      {% if '=' in entry %}
                        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.list }}
                  snooze_write_kept: >-
                    {% set ns = namespace(list=[]) %}
                    {% for p in snooze_write_pairs %}
                      {% if p.ts > snooze_write_now_ts and p.key != activity_key %}
                        {% set ns.list = ns.list + [p] %}
                      {% endif %}
                    {% endfor %}
                    {% set ns.list = ns.list + [{'key': activity_key, 'ts': snooze_write_now_ts + (snooze_hours | float(12) * 3600)}] %}
                    {{ ns.list }}
                  snooze_write_new_state: >-
                    {% set ns = namespace(parts=[]) %}
                    {% for p in snooze_write_kept %}
                      {% set ns.parts = ns.parts + [p.key ~ '=' ~ (p.ts | int)] %}
                    {% endfor %}
                    {{ ns.parts | join(';') }}
              - action: input_text.set_value
                target:
                  entity_id: "{{ snooze_helper }}"
                data:
                  value: "{{ snooze_write_new_state }}"
