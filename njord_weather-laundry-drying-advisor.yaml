blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: "\U0001F455 ha-njord Laundry Drying Advisor"
  description: |
    ## 👕 Laundry Drying Advisor for ha-njord

    Proactive notifications for outdoor laundry drying — morning advisory,
    live threshold crossing, and rain warning — powered by `ha-njord`'s
    laundry index and weather trend sensors.

    ---

    ### 🧠 Features
    - 📊 Monitors `sensor.*_laundry_index` (composite drying suitability 0–100%)
    - ☀️ Morning advisory at configurable time when conditions are favorable
    - 🔄 Optional live notification when index rises above threshold mid-day
    - 🌧️ Rain warning when dry window shrinks below minimum hours
    - 🔔 Single notification per location — updates in place
    - 💤 Snooze button to mute notifications (shared `input_text` helper)

    ---

    ### ⚙️ Requirements
    - 🧩 **Integration:** `ha-njord`
    - 📲 Home Assistant Companion App (for actionable notifications)
    - 💾 An `input_text` helper (only if you enable Snooze) — create one under
      **Settings → Devices & Services → Helpers → Text**. Can be shared with
      other ha-njord blueprints.

    ---

    ✨ Created by **st0o0**

  input:
    laundry_sensor:
      name: "\U0001F4CA Laundry Index Sensor"
      description: >
        The `ha-njord` laundry index sensor
        (e.g. `sensor.home_laundry_index`).
      selector:
        entity:
          filter:
            domain: sensor
            integration: njord

    weather_trend_sensor:
      name: "\U0001F327 Weather Trend Sensor"
      description: >
        The `ha-njord` weather trend sensor providing
        `precip_starts_in_hours` attribute
        (e.g. `sensor.home_weather_trend`).
      selector:
        entity:
          filter:
            domain: sensor
            integration: njord

    notify_target:
      name: "\U0001F4F1 Notify service"
      description: >
        The notification service/target to send alerts to
        (e.g. `notify.mobile_app_your_phone`).
      selector:
        text: {}

    threshold_section:
      name: "\U0001F4CF Thresholds"
      icon: mdi:tune
      collapsed: true
      input:
        min_index:
          name: Minimum laundry index
          description: >
            Notify only when the laundry index is at or above this value.
          default: 60
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_dry_window_hours:
          name: Minimum dry window
          description: >
            Minimum rain-free hours required for a positive advisory. If no
            precipitation data is available, conditions are treated as favorable.
          default: 4
          selector:
            number:
              min: 1
              max: 24
              step: 1
              unit_of_measurement: hours
              mode: slider

    timing_section:
      name: "⏰ Timing"
      icon: mdi:clock-outline
      collapsed: true
      input:
        check_time:
          name: Morning check time
          description: Time of day for the morning drying advisory.
          default: "07:00:00"
          selector:
            time: {}
        enable_live_trigger:
          name: Enable live threshold notification
          description: >
            Also notify when the laundry index rises above the threshold
            during the day (not just at the morning check).
          default: true
          selector:
            boolean: {}
        enable_rain_warning:
          name: Enable rain warning
          description: >
            Send a high-priority warning when the rain-free window shrinks
            below the minimum dry window.
          default: true
          selector:
            boolean: {}

    actions_section:
      name: "\U0001F518 Notification actions"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        dashboard_path:
          name: Details dashboard path
          description: >
            Path opened by the "Details" button (e.g. `/lovelace/weather`).
            Leave empty to hide the Details button.
          default: ""
          selector:
            text: {}
        enable_snooze:
          name: Enable Snooze button
          description: Show a "Snooze" button that mutes notifications for a while.
          default: true
          selector:
            boolean: {}
        snooze_helper:
          name: Snooze storage helper
          description: >
            An `input_text` helper used to store snoozed keys. Required
            when Snooze is enabled. Can be shared with other ha-njord blueprints.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        snooze_hours:
          name: Snooze duration
          description: How many hours notifications stay muted after snooze.
          default: 12
          selector:
            number:
              min: 1
              max: 72
              step: 1
              unit_of_measurement: hours
              mode: slider

mode: parallel
max_exceeded: silent

triggers:
  - trigger: time
    at: !input check_time
    id: morning

  - trigger: numeric_state
    entity_id: !input laundry_sensor
    above: !input min_index
    id: live

  - trigger: numeric_state
    entity_id: !input weather_trend_sensor
    attribute: precip_starts_in_hours
    below: !input min_dry_window_hours
    id: rain

variables:
  laundry_sensor: !input laundry_sensor
  weather_trend_sensor: !input weather_trend_sensor
  notify_target: !input notify_target
  min_index: !input min_index
  min_dry_window_hours: !input min_dry_window_hours
  enable_live_trigger: !input enable_live_trigger
  enable_rain_warning: !input enable_rain_warning
  dashboard_path: !input dashboard_path
  enable_snooze: !input enable_snooze
  snooze_helper: !input snooze_helper
  snooze_hours: !input snooze_hours

  location: >-
    {{ (laundry_sensor | string).split('.')[1] | regex_replace('_laundry_index$', '') }}
  laundry_key: "njord_laundry_{{ location }}"

  current_index: "{{ states(laundry_sensor) | float(0) }}"
  precip_h_raw: "{{ state_attr(weather_trend_sensor, 'precip_starts_in_hours') }}"
  precip_h: "{{ precip_h_raw | float(99) if precip_h_raw is not none and precip_h_raw != '' else 99 }}"
  has_dry_window: "{{ precip_h | float(99) >= min_dry_window_hours | float(4) }}"

  now_ts: "{{ as_timestamp(now()) }}"
  snooze_raw_state: "{{ (states(snooze_helper) | default('', true)) if (enable_snooze and snooze_helper | default('', true) | length > 0) else '' }}"
  snooze_pairs: >-
    {% set ns = namespace(list=[]) %}
    {% for entry in ((snooze_raw_state | string).split(';') if snooze_raw_state | length > 0 else []) %}
      {% if '=' in entry %}
        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
  is_snoozed: >-
    {{ enable_snooze and (snooze_pairs | selectattr('key', 'eq', laundry_key) | selectattr('ts', 'gt', now_ts) | list | length > 0) }}

  action_details: "URI"
  action_snooze: "{{ laundry_key | upper }}_SNOOZE_{{ context.id }}"

actions:
  - choose:
      # Morning advisory
      - conditions:
          - condition: trigger
            id: morning
        sequence:
          - if:
              - condition: template
                value_template: "{{ current_index | float(0) >= min_index | float(60) and has_dry_window and not is_snoozed }}"
            then:
              - variables:
                  notification_title: "👕 Good drying day ({{ current_index | round }}%)"
                  notification_message: >-
                    Drying index {{ current_index | round }}%
                    {%- if precip_h | float(99) < 99 %}, ~{{ precip_h | round }}h dry window{% endif %}
                  actions_list: >-
                    {% set ns = namespace(list=[]) %}
                    {% if dashboard_path | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_details, 'title': 'Details', 'uri': dashboard_path}] %}
                    {% endif %}
                    {% if enable_snooze and snooze_helper | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_snooze, 'title': 'Snooze ' ~ snooze_hours ~ 'h'}] %}
                    {% endif %}
                    {{ ns.list }}
              - action: "{{ notify_target }}"
                data:
                  title: "{{ notification_title }}"
                  message: "{{ notification_message }}"
                  data: >-
                    {{ {
                      'tag': laundry_key,
                      'actions': actions_list,
                      'channel': 'njord_laundry',
                      'importance': 'default',
                      'priority': 'default',
                    } }}
              - if:
                  - condition: template
                    value_template: "{{ enable_snooze and snooze_helper | default('', true) | length > 0 }}"
                then:
                  - wait_for_trigger:
                      - trigger: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ action_snooze }}"
                    timeout:
                      hours: 12
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ wait.trigger is not none }}"
                    then:
                      - variables:
                          snooze_write_now_ts: "{{ as_timestamp(now()) }}"
                          snooze_write_raw_state: "{{ states(snooze_helper) | default('', true) }}"
                          snooze_write_pairs: >-
                            {% set ns = namespace(list=[]) %}
                            {% for entry in ((snooze_write_raw_state | string).split(';') if snooze_write_raw_state | length > 0 else []) %}
                              {% if '=' in entry %}
                                {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.list }}
                          snooze_write_kept: >-
                            {% set ns = namespace(list=[]) %}
                            {% for p in snooze_write_pairs %}
                              {% if p.ts > snooze_write_now_ts and p.key != laundry_key %}
                                {% set ns.list = ns.list + [p] %}
                              {% endif %}
                            {% endfor %}
                            {% set ns.list = ns.list + [{'key': laundry_key, 'ts': snooze_write_now_ts + (snooze_hours | float(12) * 3600)}] %}
                            {{ ns.list }}
                          snooze_write_new_state: >-
                            {% set ns = namespace(parts=[]) %}
                            {% for p in snooze_write_kept %}
                              {% set ns.parts = ns.parts + [p.key ~ '=' ~ (p.ts | int)] %}
                            {% endfor %}
                            {{ ns.parts | join(';') }}
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ snooze_helper }}"
                        data:
                          value: "{{ snooze_write_new_state }}"

      # Live threshold crossing
      - conditions:
          - condition: trigger
            id: live
        sequence:
          - if:
              - condition: template
                value_template: "{{ enable_live_trigger and has_dry_window and not is_snoozed }}"
            then:
              - variables:
                  notification_title: "☀️ Conditions now favorable ({{ current_index | round }}%)"
                  notification_message: >-
                    Drying index {{ current_index | round }}%
                    {%- if precip_h | float(99) < 99 %}, ~{{ precip_h | round }}h dry window{% endif %}
                  actions_list: >-
                    {% set ns = namespace(list=[]) %}
                    {% if dashboard_path | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_details, 'title': 'Details', 'uri': dashboard_path}] %}
                    {% endif %}
                    {% if enable_snooze and snooze_helper | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_snooze, 'title': 'Snooze ' ~ snooze_hours ~ 'h'}] %}
                    {% endif %}
                    {{ ns.list }}
              - action: "{{ notify_target }}"
                data:
                  title: "{{ notification_title }}"
                  message: "{{ notification_message }}"
                  data: >-
                    {{ {
                      'tag': laundry_key,
                      'actions': actions_list,
                      'channel': 'njord_laundry',
                      'importance': 'default',
                      'priority': 'default',
                    } }}
              - if:
                  - condition: template
                    value_template: "{{ enable_snooze and snooze_helper | default('', true) | length > 0 }}"
                then:
                  - wait_for_trigger:
                      - trigger: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ action_snooze }}"
                    timeout:
                      hours: 12
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ wait.trigger is not none }}"
                    then:
                      - variables:
                          snooze_write_now_ts: "{{ as_timestamp(now()) }}"
                          snooze_write_raw_state: "{{ states(snooze_helper) | default('', true) }}"
                          snooze_write_pairs: >-
                            {% set ns = namespace(list=[]) %}
                            {% for entry in ((snooze_write_raw_state | string).split(';') if snooze_write_raw_state | length > 0 else []) %}
                              {% if '=' in entry %}
                                {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.list }}
                          snooze_write_kept: >-
                            {% set ns = namespace(list=[]) %}
                            {% for p in snooze_write_pairs %}
                              {% if p.ts > snooze_write_now_ts and p.key != laundry_key %}
                                {% set ns.list = ns.list + [p] %}
                              {% endif %}
                            {% endfor %}
                            {% set ns.list = ns.list + [{'key': laundry_key, 'ts': snooze_write_now_ts + (snooze_hours | float(12) * 3600)}] %}
                            {{ ns.list }}
                          snooze_write_new_state: >-
                            {% set ns = namespace(parts=[]) %}
                            {% for p in snooze_write_kept %}
                              {% set ns.parts = ns.parts + [p.key ~ '=' ~ (p.ts | int)] %}
                            {% endfor %}
                            {{ ns.parts | join(';') }}
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ snooze_helper }}"
                        data:
                          value: "{{ snooze_write_new_state }}"

      # Rain warning
      - conditions:
          - condition: trigger
            id: rain
        sequence:
          - if:
              - condition: template
                value_template: "{{ enable_rain_warning and not is_snoozed }}"
            then:
              - variables:
                  rain_hours: "{{ state_attr(weather_trend_sensor, 'precip_starts_in_hours') | float(0) | round }}"
                  notification_title: "🌧️ Rain in {{ rain_hours }}h — bring laundry inside"
                  notification_message: >-
                    Drying index {{ current_index | round }}%, rain expected in {{ rain_hours }} hours
                  actions_list: >-
                    {% set ns = namespace(list=[]) %}
                    {% if dashboard_path | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_details, 'title': 'Details', 'uri': dashboard_path}] %}
                    {% endif %}
                    {% if enable_snooze and snooze_helper | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_snooze, 'title': 'Snooze ' ~ snooze_hours ~ 'h'}] %}
                    {% endif %}
                    {{ ns.list }}
              - action: "{{ notify_target }}"
                data:
                  title: "{{ notification_title }}"
                  message: "{{ notification_message }}"
                  data: >-
                    {{ {
                      'tag': laundry_key,
                      'actions': actions_list,
                      'channel': 'njord_laundry_warning',
                      'importance': 'high',
                      'priority': 'high',
                    } }}
              - if:
                  - condition: template
                    value_template: "{{ enable_snooze and snooze_helper | default('', true) | length > 0 }}"
                then:
                  - wait_for_trigger:
                      - trigger: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ action_snooze }}"
                    timeout:
                      hours: 12
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ wait.trigger is not none }}"
                    then:
                      - variables:
                          snooze_write_now_ts: "{{ as_timestamp(now()) }}"
                          snooze_write_raw_state: "{{ states(snooze_helper) | default('', true) }}"
                          snooze_write_pairs: >-
                            {% set ns = namespace(list=[]) %}
                            {% for entry in ((snooze_write_raw_state | string).split(';') if snooze_write_raw_state | length > 0 else []) %}
                              {% if '=' in entry %}
                                {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.list }}
                          snooze_write_kept: >-
                            {% set ns = namespace(list=[]) %}
                            {% for p in snooze_write_pairs %}
                              {% if p.ts > snooze_write_now_ts and p.key != laundry_key %}
                                {% set ns.list = ns.list + [p] %}
                              {% endif %}
                            {% endfor %}
                            {% set ns.list = ns.list + [{'key': laundry_key, 'ts': snooze_write_now_ts + (snooze_hours | float(12) * 3600)}] %}
                            {{ ns.list }}
                          snooze_write_new_state: >-
                            {% set ns = namespace(parts=[]) %}
                            {% for p in snooze_write_kept %}
                              {% set ns.parts = ns.parts + [p.key ~ '=' ~ (p.ts | int)] %}
                            {% endfor %}
                            {{ ns.parts | join(';') }}
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ snooze_helper }}"
                        data:
                          value: "{{ snooze_write_new_state }}"
