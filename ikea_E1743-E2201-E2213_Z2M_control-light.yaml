blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: damru / st0o0
  domain: automation
  name: Ikea's Rodret, Somrig or Tradfri 💡 Light control
  description: |
    ## 💡 IKEA RODRET / SOMRIG / TRADFRI – Light Control for Home Assistant

    Control a light using the **IKEA RODRET (E2201)**, **SOMRIG (E2213)**, or **TRADFRI ON/OFF (E1743)** remotes via Zigbee2MQTT.
    Simple two-button control with optional force brightness on turn on.

    ---

    ### 🧠 Features
    - 💡 Turn lights **on/off** with a single press
    - 🔆 Adjust **brightness** smoothly by holding buttons
    - 🎯 Optional **force brightness** to set a fixed level when turning on
    - 📱 Supports **multiple remotes** controlling the same light

    ---

    ### 🎛️ Button Layout

    | Button | Single Press | Hold |
    |:-------|:-------------|:-----|
    | 🔼 **ON** (Rodret/Tradfri) · **1 dot** (Somrig) | Turn light on | Increase brightness |
    | 🔽 **OFF** (Rodret/Tradfri) · **2 dots** (Somrig) | Turn light off | Decrease brightness (down to 1%) |

    ---

    ### ⚙️ Compatibility
    - 🧩 **Integration:** Zigbee2MQTT (`integration: mqtt`)
    - 💬 Not compatible with ZHA
    - Supports **RODRET** (E2201), **SOMRIG** (E2213), and **TRADFRI ON/OFF** (E1743)

    ---

    ✨ Created by **damru / st0o0**
  input:
    remote_devices:
      name: 📱 Remotes
      description: >
        One or more IKEA remotes (RODRET, SOMRIG, or TRADFRI ON/OFF) paired via Zigbee2MQTT.
      default: []
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: IKEA
              model: RODRET wireless dimmer/power switch
            - integration: mqtt
              manufacturer: IKEA
              model: SOMRIG shortcut button
            - integration: mqtt
              manufacturer: IKEA
              model: TRADFRI on/off switch
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: RODRET wireless dimmer/power switch (E2201)
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: SOMRIG shortcut button (E2213)
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: TRADFRI on/off switch (E1743)
          multiple: true
    light:
      name: 💡 Light
      description: The light entity to control with this remote.
      selector:
        entity:
          filter:
            domain: light
          multiple: false
    brightness_section:
      name: Brightness
      icon: mdi:lightbulb-on-50
      collapsed: true
      input:
        helper_force_brightness:
          name: Force brightness on turn on
          description: >
            When enabled, the light will always turn on at the configured
            **Brightness** value instead of its previous level.
          default: false
          selector:
            boolean: {}
        helper_brightness:
          name: Brightness
          description: >
            Target brightness when turning on. Requires **Force brightness**
            to be enabled.
          default: 50
          selector:
            number:
              unit_of_measurement: "%"
              min: 1.0
              max: 100.0
              step: 1.0
              mode: slider
mode: restart
max_exceeded: silent
triggers:
  # RODRET (E2201) - TRADFRI (E1743)
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "on"
    id: press-on-z2m-e1743-e2201
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "off"
    id: press-off-z2m-e1743-e2201
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_up
    id: hold-on-z2m-e1743-e2201
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_down
    id: hold-off-z2m-e1743-e2201
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_stop
    id: release-z2m-e1743-e2201

  # SOMRIG - E2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 1_short_release
    id: press-dots1-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 2_short_release
    id: press-dots2-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 1_long_press
    id: hold-dots1-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 2_long_press
    id: hold-dots2-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 1_long_release
    id: release-hold-dots1-z2m-e2213
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: 2_long_release
    id: release-hold-dots2-z2m-e2213
variables:
  helper_force_brightness: !input helper_force_brightness
  helper_hold_delay: 0.25
  helper_hold_dim_step: 4
  is_mqtt: "{{ trigger.platform == 'mqtt' }}"
  light: !input light
  mqtt_topic: "{{ trigger.topic }}"
  remote_devices: !input remote_devices
  remote_devices_names: "{{ remote_devices | map('device_attr', 'name') | map('regex_replace', find='^.*/', replace='', ignorecase=False) | list }}"
condition:
  - condition: template
    value_template: >-
      {{
        (trigger.topic.split('/')[2] in remote_devices_names if is_mqtt)
      }}
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - press-on-z2m-e1743-e2201
              - press-dots1-z2m-e2213
        sequence:
          - choose:
              - conditions: "{{ helper_force_brightness }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      brightness_pct: !input helper_brightness
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data: {}
      - conditions:
          - condition: trigger
            id:
              - press-off-z2m-e1743-e2201
              - press-dots2-z2m-e2213
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light
            data: {}
      - conditions:
          - condition: trigger
            id:
              - hold-on-z2m-e1743-e2201
              - hold-dots1-z2m-e2213
        sequence:
          - repeat:
              while:
                - condition: trigger
                  id:
                    - hold-on-z2m-e1743-e2201
                    - hold-dots1-z2m-e2213
              sequence:
                - parallel:
                    - action: light.turn_on
                      target:
                        entity_id: !input light
                      data:
                        brightness_step_pct: "{{ helper_hold_dim_step }}"
                        transition: "{{ helper_hold_delay }}"
                    - delay: "{{ helper_hold_delay }}"
      - conditions:
          - condition: trigger
            id:
              - hold-off-z2m-e1743-e2201
              - hold-dots2-z2m-e2213
        sequence:
          - variables:
              brightness_pct: "{{ iif(is_state(light, 'on'), state_attr(light, 'brightness'), 0) * 100 / 255 }}"
              total_iterations_to_zero: "{{ (brightness_pct / helper_hold_dim_step) | round(0, 'ceil') }}"
          - repeat:
              count: "{{ total_iterations_to_zero - 1 }}"
              sequence:
                - parallel:
                    - action: light.turn_on
                      target:
                        entity_id: !input light
                      data:
                        brightness_step_pct: "{{ helper_hold_dim_step | int * -1 }}"
                        transition: "{{ helper_hold_delay }}"
                    - delay: "{{ helper_hold_delay }}"
          - action: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness_pct: 1
              transition: "{{ helper_hold_delay }}"
