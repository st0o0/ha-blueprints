blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: "⚠️ ha-njord Consensus Reliability Warning"
  description: |
    ## ⚠️ Consensus Reliability Warning for ha-njord

    Warns when weather model agreement drops, indicating an unreliable
    forecast — powered by `ha-njord`'s consensus weather entity.

    ---

    ### 🧠 Features
    - 📊 Monitors `weather.*_consensus` entity's `agreement` attribute
    - 🔄 Crossing detection — only triggers on actual drops, not sustained low
    - 🌡️ Spread-based priority — high temperature spread triggers critical channel
    - ✅ Optional recovery notification when agreement bounces back
    - 🔔 Single notification per location — updates in place via stable tag
    - 💤 Snooze button (suppresses warnings, not recovery)
    - 📊 Rich message: agreement %, spread, model count, reliable hours

    ---

    ### ⚙️ Requirements
    - 🧩 **Integration:** `ha-njord`
    - 📲 Home Assistant Companion App (for actionable notifications)
    - 💾 An `input_text` helper (only if you enable Snooze) — create one under
      **Settings → Devices & Services → Helpers → Text**. Can be shared with
      other ha-njord blueprints.

    ---

    ✨ Created by **st0o0**

  input:
    consensus_entity:
      name: "\U0001F4CA Consensus Weather Entity"
      description: >
        The `ha-njord` consensus weather entity
        (e.g. `weather.vreden_consensus`).
      selector:
        entity:
          filter:
            domain: weather
            integration: njord

    notify_target:
      name: "\U0001F4F1 Notify service"
      description: >
        The notification service/target to send alerts to
        (e.g. `notify.mobile_app_your_phone`).
      selector:
        text: {}

    threshold_section:
      name: "\U0001F4CF Thresholds"
      icon: mdi:tune
      collapsed: true
      input:
        agreement_min:
          name: Minimum agreement
          description: >
            Notify when model agreement drops below this value.
            0.6 = 60% agreement (WHO-style moderate reliability).
          default: 0.6
          selector:
            number:
              min: 0.1
              max: 1.0
              step: 0.05
              mode: slider
        spread_critical:
          name: Critical spread threshold
          description: >
            Temperature spread (°C) at or above which the notification
            uses a high-priority channel.
          default: 6
          selector:
            number:
              min: 1
              max: 15
              step: 1
              unit_of_measurement: "°C"
              mode: slider

    lifecycle_section:
      name: "\U0001F504 Lifecycle"
      icon: mdi:progress-clock
      collapsed: true
      input:
        notify_on_recovery:
          name: Notify on recovery
          description: >
            Send a notification when agreement recovers above the threshold
            after having been below it.
          default: false
          selector:
            boolean: {}

    actions_section:
      name: "\U0001F518 Notification actions"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        dashboard_path:
          name: Details dashboard path
          description: >
            Path opened by the "Details" button (e.g. `/lovelace/weather`).
            Leave empty to hide the Details button.
          default: ""
          selector:
            text: {}
        enable_snooze:
          name: Enable Snooze button
          description: Show a "Snooze" button that mutes warning notifications for a while.
          default: true
          selector:
            boolean: {}
        snooze_helper:
          name: Snooze storage helper
          description: >
            An `input_text` helper used to store snoozed keys. Required
            when Snooze is enabled. Can be shared with other ha-njord blueprints.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        snooze_hours:
          name: Snooze duration
          description: How many hours warning notifications stay muted after snooze.
          default: 6
          selector:
            number:
              min: 1
              max: 48
              step: 1
              unit_of_measurement: hours
              mode: slider

mode: parallel
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input consensus_entity
    id: consensus_change

variables:
  consensus_entity: !input consensus_entity
  notify_target: !input notify_target
  agreement_min: !input agreement_min
  spread_critical: !input spread_critical
  notify_on_recovery: !input notify_on_recovery
  dashboard_path: !input dashboard_path
  enable_snooze: !input enable_snooze
  snooze_helper: !input snooze_helper
  snooze_hours: !input snooze_hours

  location: >-
    {{ (consensus_entity | string).split('.')[1] | regex_replace('_consensus$', '') }}
  consensus_key: "njord_consensus_{{ location }}"

  agreement: "{{ state_attr(consensus_entity, 'agreement') | float(1) }}"
  prev_agreement: "{{ trigger.from_state.attributes.agreement | default(1) | float(1) }}"
  spread: "{{ state_attr(consensus_entity, 'spread') | float(0) }}"
  available_models: "{{ state_attr(consensus_entity, 'available_models') | int(0) }}"
  reliable_hours: "{{ state_attr(consensus_entity, 'reliable_hours') | int(0) }}"

  crossed_below: "{{ prev_agreement | float(1) >= agreement_min | float(0.6) and agreement | float(1) < agreement_min | float(0.6) }}"
  crossed_above: "{{ prev_agreement | float(1) < agreement_min | float(0.6) and agreement | float(1) >= agreement_min | float(0.6) }}"

  is_critical: "{{ spread | float(0) >= spread_critical | float(6) }}"

  now_ts: "{{ as_timestamp(now()) }}"
  snooze_raw_state: "{{ (states(snooze_helper) | default('', true)) if (enable_snooze and snooze_helper | default('', true) | length > 0) else '' }}"
  snooze_pairs: >-
    {% set ns = namespace(list=[]) %}
    {% for entry in ((snooze_raw_state | string).split(';') if snooze_raw_state | length > 0 else []) %}
      {% if '=' in entry %}
        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
  is_snoozed: >-
    {{ enable_snooze and (snooze_pairs | selectattr('key', 'eq', consensus_key) | selectattr('ts', 'gt', now_ts) | list | length > 0) }}

  action_details: "URI"
  action_snooze: "{{ consensus_key | upper }}_SNOOZE_{{ context.id }}"

actions:
  - choose:
      # Downward crossing — agreement dropped below threshold
      - conditions:
          - condition: template
            value_template: "{{ crossed_below }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ not is_snoozed }}"
            then:
              - variables:
                  agreement_pct: "{{ (agreement | float(1) * 100) | round }}"
                  notification_title: >-
                    {{ '🔴 Weather models strongly disagree' if is_critical else '⚠️ Weather forecast unreliable' }}
                  notification_message: >-
                    {{ agreement_pct }}% agreement, ±{{ spread | float(0) | round(1) }}°C spread
                    {{ available_models }} models active, {{ reliable_hours }}h reliable
                  actions_list: >-
                    {% set ns = namespace(list=[]) %}
                    {% if dashboard_path | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_details, 'title': 'Details', 'uri': dashboard_path}] %}
                    {% endif %}
                    {% if enable_snooze and snooze_helper | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_snooze, 'title': 'Snooze ' ~ snooze_hours ~ 'h'}] %}
                    {% endif %}
                    {{ ns.list }}
              - action: "{{ notify_target }}"
                data:
                  title: "{{ notification_title }}"
                  message: "{{ notification_message }}"
                  data: >-
                    {{ {
                      'tag': consensus_key,
                      'actions': actions_list,
                      'channel': ('njord_consensus_critical' if is_critical else 'njord_consensus'),
                      'importance': ('high' if is_critical else 'default'),
                      'priority': ('high' if is_critical else 'default'),
                    } }}
              - if:
                  - condition: template
                    value_template: "{{ enable_snooze and snooze_helper | default('', true) | length > 0 }}"
                then:
                  - wait_for_trigger:
                      - trigger: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ action_snooze }}"
                    timeout:
                      hours: 12
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ wait.trigger is not none }}"
                    then:
                      - variables:
                          snooze_write_now_ts: "{{ as_timestamp(now()) }}"
                          snooze_write_raw_state: "{{ states(snooze_helper) | default('', true) }}"
                          snooze_write_pairs: >-
                            {% set ns = namespace(list=[]) %}
                            {% for entry in ((snooze_write_raw_state | string).split(';') if snooze_write_raw_state | length > 0 else []) %}
                              {% if '=' in entry %}
                                {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.list }}
                          snooze_write_kept: >-
                            {% set ns = namespace(list=[]) %}
                            {% for p in snooze_write_pairs %}
                              {% if p.ts > snooze_write_now_ts and p.key != consensus_key %}
                                {% set ns.list = ns.list + [p] %}
                              {% endif %}
                            {% endfor %}
                            {% set ns.list = ns.list + [{'key': consensus_key, 'ts': snooze_write_now_ts + (snooze_hours | float(6) * 3600)}] %}
                            {{ ns.list }}
                          snooze_write_new_state: >-
                            {% set ns = namespace(parts=[]) %}
                            {% for p in snooze_write_kept %}
                              {% set ns.parts = ns.parts + [p.key ~ '=' ~ (p.ts | int)] %}
                            {% endfor %}
                            {{ ns.parts | join(';') }}
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ snooze_helper }}"
                        data:
                          value: "{{ snooze_write_new_state }}"

      # Upward crossing — agreement recovered above threshold
      - conditions:
          - condition: template
            value_template: "{{ crossed_above and notify_on_recovery }}"
        sequence:
          - variables:
              agreement_pct: "{{ (agreement | float(1) * 100) | round }}"
              notification_title: "✅ Forecast reliable again"
              notification_message: >-
                {{ agreement_pct }}% agreement, ±{{ spread | float(0) | round(1) }}°C spread
          - action: "{{ notify_target }}"
            data:
              title: "{{ notification_title }}"
              message: "{{ notification_message }}"
              data: >-
                {{ {
                  'tag': consensus_key,
                  'channel': 'njord_consensus',
                  'importance': 'default',
                  'priority': 'default',
                } }}
