blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: "\U0001F32B ha-njord Inversion Ventilation Lock"
  description: |
    ## 🌫️ Inversion Ventilation Lock for ha-njord

    Warns when a temperature inversion is detected — a signal for trapped
    pollutants and poor outdoor air quality — so you can avoid ventilating
    with dirty air. Powered by `ha-njord`'s inversion binary sensor.

    ---

    ### 🧠 Features
    - 📊 Monitors `binary_sensor.*_inversion` for inversion events
    - 🏠 Optional heating-season filter via `sensor.*_hdd` (heating degree days)
    - ✅ Optional recovery notification when inversion clears
    - 🔔 Single notification per location — updates in place via stable tag
    - 💤 Snooze button to mute notifications
    - 📱 "Details" and "Snooze" action buttons

    ---

    ### ⚙️ Requirements
    - 🧩 **Integration:** `ha-njord`
    - 📲 Home Assistant Companion App (for actionable notifications)
    - 💾 An `input_text` helper (only if you enable Snooze) — create one under
      **Settings → Devices & Services → Helpers → Text**. Can be shared with
      other ha-njord blueprints.

    ---

    ✨ Created by **st0o0**

  input:
    inversion_sensor:
      name: "\U0001F32B Inversion Sensor"
      description: >
        The `ha-njord` inversion binary sensor
        (e.g. `binary_sensor.home_inversion`).
      selector:
        entity:
          filter:
            domain: binary_sensor
            integration: njord

    notify_target:
      name: "\U0001F4F1 Notify service"
      description: >
        The notification service/target to send alerts to
        (e.g. `notify.mobile_app_your_phone`).
      selector:
        text: {}

    threshold_section:
      name: "\U0001F4CF Heating season"
      icon: mdi:thermometer
      collapsed: true
      input:
        hdd_sensor:
          name: Heating degree days sensor (optional)
          description: >
            Optional `ha-njord` HDD sensor to limit notifications to heating
            season. Leave empty to notify on all inversions year-round.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
                integration: njord
        hdd_min:
          name: Minimum HDD for heating season
          description: >
            Inversion notifications are only sent when HDD is at or above
            this value. Only used when the HDD sensor is configured.
          default: 5
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: slider

    lifecycle_section:
      name: "\U0001F504 Lifecycle"
      icon: mdi:progress-clock
      collapsed: true
      input:
        notify_on_cleared:
          name: Notify on cleared
          description: >
            Send a notification when the inversion clears and air quality
            improves.
          default: false
          selector:
            boolean: {}

    actions_section:
      name: "\U0001F518 Notification actions"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        dashboard_path:
          name: Details dashboard path
          description: >
            Path opened by the "Details" button (e.g. `/lovelace/weather`).
            Leave empty to hide the Details button.
          default: ""
          selector:
            text: {}
        enable_snooze:
          name: Enable Snooze button
          description: Show a "Snooze" button that mutes notifications for a while.
          default: true
          selector:
            boolean: {}
        snooze_helper:
          name: Snooze storage helper
          description: >
            An `input_text` helper used to store snoozed keys. Required
            when Snooze is enabled. Can be shared with other ha-njord blueprints.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        snooze_hours:
          name: Snooze duration
          description: How many hours notifications stay muted after snooze.
          default: 6
          selector:
            number:
              min: 1
              max: 48
              step: 1
              unit_of_measurement: hours
              mode: slider

mode: parallel
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input inversion_sensor
    to: "on"
    id: inversion_on

  - trigger: state
    entity_id: !input inversion_sensor
    to: "off"
    id: inversion_off

variables:
  inversion_sensor: !input inversion_sensor
  notify_target: !input notify_target
  hdd_sensor: !input hdd_sensor
  hdd_min: !input hdd_min
  notify_on_cleared: !input notify_on_cleared
  dashboard_path: !input dashboard_path
  enable_snooze: !input enable_snooze
  snooze_helper: !input snooze_helper
  snooze_hours: !input snooze_hours

  location: >-
    {{ (inversion_sensor | string).split('.')[1] | regex_replace('_inversion$', '') }}
  inversion_key: "njord_inversion_{{ location }}"

  hdd_value: "{{ states(hdd_sensor) | float(0) if hdd_sensor | default('', true) | length > 0 else 99 }}"
  in_heating_season: "{{ hdd_sensor | default('', true) | length == 0 or hdd_value | float(99) >= hdd_min | float(5) }}"

  now_ts: "{{ as_timestamp(now()) }}"
  snooze_raw_state: "{{ (states(snooze_helper) | default('', true)) if (enable_snooze and snooze_helper | default('', true) | length > 0) else '' }}"
  snooze_pairs: >-
    {% set ns = namespace(list=[]) %}
    {% for entry in ((snooze_raw_state | string).split(';') if snooze_raw_state | length > 0 else []) %}
      {% if '=' in entry %}
        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
  is_snoozed: >-
    {{ enable_snooze and (snooze_pairs | selectattr('key', 'eq', inversion_key) | selectattr('ts', 'gt', now_ts) | list | length > 0) }}

  action_details: "URI"
  action_snooze: "{{ inversion_key | upper }}_SNOOZE_{{ context.id }}"

actions:
  - choose:
      # Inversion detected
      - conditions:
          - condition: trigger
            id: inversion_on
        sequence:
          - if:
              - condition: template
                value_template: "{{ in_heating_season and not is_snoozed }}"
            then:
              - variables:
                  notification_title: "🌫️ Inversionslage — nicht lüften"
                  notification_message: >-
                    Temperaturinversion erkannt, Schadstoffe stauen sich in Bodennähe.
                    Fenster geschlossen halten
                    {%- if hdd_sensor | default('', true) | length > 0 %}, HDD {{ hdd_value | round(1) }}{% endif %}
                  actions_list: >-
                    {% set ns = namespace(list=[]) %}
                    {% if dashboard_path | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_details, 'title': 'Details', 'uri': dashboard_path}] %}
                    {% endif %}
                    {% if enable_snooze and snooze_helper | default('', true) | length > 0 %}
                      {% set ns.list = ns.list + [{'action': action_snooze, 'title': 'Snooze ' ~ snooze_hours ~ 'h'}] %}
                    {% endif %}
                    {{ ns.list }}
              - action: "{{ notify_target }}"
                data:
                  title: "{{ notification_title }}"
                  message: "{{ notification_message }}"
                  data: >-
                    {{ {
                      'tag': inversion_key,
                      'actions': actions_list,
                      'channel': 'njord_inversion',
                      'importance': 'high',
                      'priority': 'high',
                    } }}
              - if:
                  - condition: template
                    value_template: "{{ enable_snooze and snooze_helper | default('', true) | length > 0 }}"
                then:
                  - wait_for_trigger:
                      - trigger: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: "{{ action_snooze }}"
                    timeout:
                      hours: 12
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: "{{ wait.trigger is not none }}"
                    then:
                      - variables:
                          snooze_write_now_ts: "{{ as_timestamp(now()) }}"
                          snooze_write_raw_state: "{{ states(snooze_helper) | default('', true) }}"
                          snooze_write_pairs: >-
                            {% set ns = namespace(list=[]) %}
                            {% for entry in ((snooze_write_raw_state | string).split(';') if snooze_write_raw_state | length > 0 else []) %}
                              {% if '=' in entry %}
                                {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
                              {% endif %}
                            {% endfor %}
                            {{ ns.list }}
                          snooze_write_kept: >-
                            {% set ns = namespace(list=[]) %}
                            {% for p in snooze_write_pairs %}
                              {% if p.ts > snooze_write_now_ts and p.key != inversion_key %}
                                {% set ns.list = ns.list + [p] %}
                              {% endif %}
                            {% endfor %}
                            {% set ns.list = ns.list + [{'key': inversion_key, 'ts': snooze_write_now_ts + (snooze_hours | float(6) * 3600)}] %}
                            {{ ns.list }}
                          snooze_write_new_state: >-
                            {% set ns = namespace(parts=[]) %}
                            {% for p in snooze_write_kept %}
                              {% set ns.parts = ns.parts + [p.key ~ '=' ~ (p.ts | int)] %}
                            {% endfor %}
                            {{ ns.parts | join(';') }}
                      - action: input_text.set_value
                        target:
                          entity_id: "{{ snooze_helper }}"
                        data:
                          value: "{{ snooze_write_new_state }}"

      # Inversion cleared
      - conditions:
          - condition: trigger
            id: inversion_off
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_on_cleared }}"
            then:
              - action: "{{ notify_target }}"
                data:
                  title: "✅ Inversionslage aufgelöst"
                  message: "Luftqualität verbessert — Lüften wieder möglich"
                  data: >-
                    {{ {
                      'tag': inversion_key,
                      'channel': 'njord_inversion',
                      'importance': 'default',
                      'priority': 'default',
                    } }}
