blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: "\U0001F319 ha-njord Night Cooling Advisor"
  description: |
    ## 🌙 Night Cooling Advisor for ha-njord

    Notifies when night cooling conditions are favorable — open windows
    to cool your home passively using cool night air. Powered by
    `ha-njord`'s night cooling sensor.

    ---

    ### 🧠 Features
    - 📊 Monitors `sensor.*_night_cooling` for threshold crossing
    - ⏰ Time-window filter (default 22:00–05:00) — only notifies at night
    - 🌡️ Indoor vs. outdoor temperature comparison — no notification when
      indoor is already cooler
    - 🔔 Single notification per location — updates in place via stable tag
    - 💤 Snooze button to mute notifications
    - 📱 "Details" and "Snooze" action buttons

    ---

    ### ⚙️ Requirements
    - 🧩 **Integration:** `ha-njord`
    - 📲 Home Assistant Companion App (for actionable notifications)
    - 🌡️ An indoor temperature sensor (any `sensor` entity with °C / °F)
    - 💾 An `input_text` helper (only if you enable Snooze) — create one under
      **Settings → Devices & Services → Helpers → Text**. Can be shared with
      other ha-njord blueprints.

    ---

    ✨ Created by **st0o0**

  input:
    night_cooling_sensor:
      name: "\U0001F319 Night Cooling Sensor"
      description: >
        The `ha-njord` night cooling sensor
        (e.g. `sensor.home_night_cooling`).
      selector:
        entity:
          filter:
            domain: sensor
            integration: njord

    indoor_temp_sensor:
      name: "\U0001F321 Indoor Temperature Sensor"
      description: >
        An indoor temperature sensor (any integration) to compare against
        outdoor temperature.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature

    notify_target:
      name: "\U0001F4F1 Notify service"
      description: >
        The notification service/target to send alerts to
        (e.g. `notify.mobile_app_your_phone`).
      selector:
        text: {}

    threshold_section:
      name: "\U0001F4CF Thresholds"
      icon: mdi:tune
      collapsed: true
      input:
        night_cooling_min:
          name: Minimum night cooling index
          description: >
            Notify only when the night cooling index is at or above this value.
          default: 60
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    timing_section:
      name: "⏰ Time window"
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_window_start:
          name: Window start
          description: Earliest time for night cooling notifications.
          default: "22:00:00"
          selector:
            time: {}
        time_window_end:
          name: Window end
          description: Latest time for night cooling notifications.
          default: "05:00:00"
          selector:
            time: {}

    actions_section:
      name: "\U0001F518 Notification actions"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        dashboard_path:
          name: Details dashboard path
          description: >
            Path opened by the "Details" button (e.g. `/lovelace/weather`).
            Leave empty to hide the Details button.
          default: ""
          selector:
            text: {}
        enable_snooze:
          name: Enable Snooze button
          description: Show a "Snooze" button that mutes notifications for a while.
          default: true
          selector:
            boolean: {}
        snooze_helper:
          name: Snooze storage helper
          description: >
            An `input_text` helper used to store snoozed keys. Required
            when Snooze is enabled. Can be shared with other ha-njord blueprints.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        snooze_hours:
          name: Snooze duration
          description: How many hours notifications stay muted after snooze.
          default: 8
          selector:
            number:
              min: 1
              max: 24
              step: 1
              unit_of_measurement: hours
              mode: slider

mode: parallel
max_exceeded: silent

triggers:
  - trigger: numeric_state
    entity_id: !input night_cooling_sensor
    above: !input night_cooling_min
    id: cooling_rise

variables:
  night_cooling_sensor: !input night_cooling_sensor
  indoor_temp_sensor: !input indoor_temp_sensor
  notify_target: !input notify_target
  night_cooling_min: !input night_cooling_min
  time_window_start: !input time_window_start
  time_window_end: !input time_window_end
  dashboard_path: !input dashboard_path
  enable_snooze: !input enable_snooze
  snooze_helper: !input snooze_helper
  snooze_hours: !input snooze_hours

  location: >-
    {{ (night_cooling_sensor | string).split('.')[1] | regex_replace('_night_cooling$', '') }}
  cooling_key: "njord_night_cooling_{{ location }}"

  current_index: "{{ states(night_cooling_sensor) | float(0) }}"
  indoor_temp: "{{ states(indoor_temp_sensor) | float(0) }}"
  outdoor_temp_raw: "{{ state_attr(night_cooling_sensor, 'outdoor_temperature') }}"
  outdoor_temp: "{{ outdoor_temp_raw | float(0) if outdoor_temp_raw is not none and outdoor_temp_raw != '' else 0 }}"
  indoor_warmer: "{{ indoor_temp | float(0) > outdoor_temp | float(0) }}"

  now_ts: "{{ as_timestamp(now()) }}"
  snooze_raw_state: "{{ (states(snooze_helper) | default('', true)) if (enable_snooze and snooze_helper | default('', true) | length > 0) else '' }}"
  snooze_pairs: >-
    {% set ns = namespace(list=[]) %}
    {% for entry in ((snooze_raw_state | string).split(';') if snooze_raw_state | length > 0 else []) %}
      {% if '=' in entry %}
        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
  is_snoozed: >-
    {{ enable_snooze and (snooze_pairs | selectattr('key', 'eq', cooling_key) | selectattr('ts', 'gt', now_ts) | list | length > 0) }}

  action_details: "URI"
  action_snooze: "{{ cooling_key | upper }}_SNOOZE_{{ context.id }}"

actions:
  - condition: time
    after: !input time_window_start
    before: !input time_window_end

  - if:
      - condition: template
        value_template: "{{ indoor_warmer and not is_snoozed }}"
    then:
      - variables:
          notification_title: "🌙 Nachtauskühlung möglich ({{ current_index | round }}%)"
          notification_message: >-
            Innen {{ indoor_temp | round(1) }}°C, außen {{ outdoor_temp | round(1) }}°C
            — Fenster öffnen zum Kühlen
          actions_list: >-
            {% set ns = namespace(list=[]) %}
            {% if dashboard_path | default('', true) | length > 0 %}
              {% set ns.list = ns.list + [{'action': action_details, 'title': 'Details', 'uri': dashboard_path}] %}
            {% endif %}
            {% if enable_snooze and snooze_helper | default('', true) | length > 0 %}
              {% set ns.list = ns.list + [{'action': action_snooze, 'title': 'Snooze ' ~ snooze_hours ~ 'h'}] %}
            {% endif %}
            {{ ns.list }}
      - action: "{{ notify_target }}"
        data:
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"
          data: >-
            {{ {
              'tag': cooling_key,
              'actions': actions_list,
              'channel': 'njord_night_cooling',
              'importance': 'default',
              'priority': 'default',
            } }}
      - if:
          - condition: template
            value_template: "{{ enable_snooze and snooze_helper | default('', true) | length > 0 }}"
        then:
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_snooze }}"
            timeout:
              hours: 12
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.trigger is not none }}"
            then:
              - variables:
                  snooze_write_now_ts: "{{ as_timestamp(now()) }}"
                  snooze_write_raw_state: "{{ states(snooze_helper) | default('', true) }}"
                  snooze_write_pairs: >-
                    {% set ns = namespace(list=[]) %}
                    {% for entry in ((snooze_write_raw_state | string).split(';') if snooze_write_raw_state | length > 0 else []) %}
                      {% if '=' in entry %}
                        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.list }}
                  snooze_write_kept: >-
                    {% set ns = namespace(list=[]) %}
                    {% for p in snooze_write_pairs %}
                      {% if p.ts > snooze_write_now_ts and p.key != cooling_key %}
                        {% set ns.list = ns.list + [p] %}
                      {% endif %}
                    {% endfor %}
                    {% set ns.list = ns.list + [{'key': cooling_key, 'ts': snooze_write_now_ts + (snooze_hours | float(8) * 3600)}] %}
                    {{ ns.list }}
                  snooze_write_new_state: >-
                    {% set ns = namespace(parts=[]) %}
                    {% for p in snooze_write_kept %}
                      {% set ns.parts = ns.parts + [p.key ~ '=' ~ (p.ts | int)] %}
                    {% endfor %}
                    {{ ns.parts | join(';') }}
              - action: input_text.set_value
                target:
                  entity_id: "{{ snooze_helper }}"
                data:
                  value: "{{ snooze_write_new_state }}"
