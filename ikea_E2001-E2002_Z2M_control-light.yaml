blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: Ikea's Styrbar 💡 Light control
  description: |
    ## 💡 IKEA STYRBAR – Smart Light Control for Home Assistant

    Control your lights using the **IKEA STYRBAR Remote (E2001/E2002)** via Zigbee2MQTT.
    This blueprint combines simple setup with advanced options — perfect for intuitive and smooth light control.

    ---

    ### 🧠 Features
    - 💡 Turn lights **on/off**
    - 🔆 Adjust **brightness** (tap or hold)
    - 🌡️ Change **color temperature** (left = warmer 🔥, right = cooler ❄️) or **RGB hue** 🌈
    - 🎯 Optional **force settings** for brightness and color when switching on
    - ⏩ **Double press ON** to apply standard values (brightness + temperature or brightness + RGB)
    - 🔄 **Double press OFF** to toggle between Temperature and RGB color mode at runtime
    - 📱 Supports **multiple remotes** controlling the same light

    ---

    ### 🎛️ Button Layout

    | Button | Single Press | Double Press | Hold |
    |:-------|:-------------|:------------|:-----|
    | 🔼 **Top (ON)** | Turn on (with optional force values) | Apply standard brightness + color values | Increase brightness |
    | 🔽 **Bottom (OFF)** | Turn off | Toggle Temperature / RGB mode 🔄 | Decrease brightness |
    | ◀ **Left** | Warmer 🔥 / previous hue | — | Continuously adjust left |
    | ▶ **Right** | Cooler ❄️ / next hue | — | Continuously adjust right |

    ---

    ### ⚙️ Compatibility
    - 🧩 **Integration:** Zigbee2MQTT (`integration: mqtt`)
    - 💬 Not compatible with ZHA
    - Supports both `E2001` and `E2002` models

    ---

    ### 🔄 Color Mode Toggle
    To toggle between Temperature and RGB mode at runtime, create an `input_boolean`
    helper in Home Assistant, assign it under **Color mode toggle entity**, and enable
    **Expose double press OFF**. Double pressing the OFF button will then toggle the mode.

    ---

    ✨ Created by **st0o0**
  input:
    remote_devices:
      name: 📱 Remotes
      description: >
        One or more IKEA STYRBAR remotes (E2001/E2002) paired via Zigbee2MQTT.
      default: []
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control (E2001/E2002)
          multiple: true
    light:
      name: 💡 Light
      description: The light entity to control with this remote.
      selector:
        entity:
          filter:
            domain: light
          multiple: false
    brightness_section:
      name: Brightness
      icon: mdi:lightbulb-on-50
      collapsed: true
      input:
        helper_force_brightness:
          name: Force brightness on turn on
          description: >
            When enabled, the light will always turn on at the configured
            **Brightness** value instead of its previous level.
          default: false
          selector:
            boolean: {}
        helper_brightness:
          name: Brightness
          description: >
            Target brightness when turning on (requires **Force brightness** to be enabled).
            Also used as the standard brightness for **double press ON**.
          default: 50
          selector:
            number:
              unit_of_measurement: "%"
              min: 1.0
              max: 100.0
              step: 1.0
              mode: slider
    color_mode_section:
      name: Color mode
      icon: mdi:palette
      collapsed: true
      input:
        helper_color_mode:
          name: Default color mode
          description: >
            Controls what the **left/right arrow buttons** adjust.
            **Temperature** changes warm/cool white (Kelvin),
            **RGB** cycles through hue colors.
            If a **Color mode toggle entity** is configured, the runtime state
            of that entity overrides this setting.
          default: temperature
          selector:
            select:
              options:
                - label: "Color Temperature (Kelvin)"
                  value: temperature
                - label: "RGB Color (Hue)"
                  value: rgb
              mode: dropdown
        helper_color_mode_entity:
          name: Color mode toggle entity (optional)
          description: >
            An `input_boolean` helper for **runtime toggling** between Temperature
            and RGB mode. **Off** = Temperature, **On** = RGB.
            Enable **Expose double press OFF** to toggle this with the remote.
            Leave empty to use only the static default color mode above.
          default: []
          selector:
            entity:
              filter:
                domain: input_boolean
              multiple: false
    temperature_section:
      name: Temperature
      icon: mdi:lightbulb-variant
      collapsed: true
      input:
        helper_force_temperature:
          name: Force temperature on turn on
          description: >
            When enabled, the light will always turn on at the configured
            **Temperature** value instead of its previous color temperature.
          default: false
          selector:
            boolean: {}
        helper_temperature:
          name: Temperature
          description: >
            Target color temperature when turning on (requires **Force temperature**
            to be enabled). Also used as the standard temperature for
            **double press ON** in Temperature mode.
          default: 2700
          selector:
            number:
              unit_of_measurement: "K"
              min: 2000
              max: 6500
              step: 100
              mode: slider
        helper_temperature_step:
          name: Temperature step size
          description: >
            How much the color temperature changes per arrow press or hold step.
            Smaller values give smoother transitions, larger values faster changes.
          default: 300
          selector:
            number:
              unit_of_measurement: "K"
              min: 50
              max: 700
              step: 50
              mode: slider
    rgb_section:
      name: RGB Color
      icon: mdi:palette-outline
      collapsed: true
      input:
        helper_default_hue:
          name: Standard hue
          description: >
            Default hue value (0-360) applied when **double press ON** is used
            in RGB mode.
          default: 30
          selector:
            number:
              unit_of_measurement: "°"
              min: 0
              max: 360
              step: 5
              mode: slider
        helper_hue_step:
          name: Hue step size
          description: >
            How many degrees (0-360) the hue shifts per arrow press or hold step.
            Smaller values give smoother transitions, larger values more dramatic jumps.
          default: 30
          selector:
            number:
              unit_of_measurement: "°"
              min: 5
              max: 90
              step: 5
              mode: slider
        helper_saturation:
          name: Saturation
          description: >
            Color saturation for RGB mode (100 = fully saturated).
            Also used as the standard saturation for **double press ON** in RGB mode.
          default: 100
          selector:
            number:
              unit_of_measurement: "%"
              min: 10
              max: 100
              step: 5
              mode: slider
    styrbar_options_section:
      name: 🔄 Double press & timing options
      icon: mdi:remote
      collapsed: true
      input:
        on_double_press_exposed:
          name: Expose double press ON
          description: >
            Enable **double press** detection on the **ON** button.
            Double pressing applies the standard brightness and color values
            (temperature or RGB depending on the active color mode).
            Adds a small delay to single press detection.
          default: false
          selector:
            boolean: {}
        off_double_press_exposed:
          name: Expose double press OFF
          description: >
            Enable **double press** detection on the **OFF** button.
            Double pressing toggles between Temperature and RGB color mode.
            Requires a **Color mode toggle entity** to be configured.
            Adds a small delay to single press detection.
          default: false
          selector:
            boolean: {}
        helper_double_press_delay:
          name: Double press delay
          description: >
            Maximum time between first and second press for double press detection.
            Increase if double press is not detected reliably.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_hold_delay:
          name: Hold delay
          description: >
            Time between repeated actions while a button is held down.
            Lower values give faster response, higher values give more control.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_max_loops:
          name: Max hold loops
          description: >
            Maximum number of action repetitions while holding a button.
            Prevents infinite loops if button release is not detected.
          default: 20
          selector:
            number:
              min: 1.0
              max: 1000.0
              step: 1.0
              mode: slider
mode: restart
max_exceeded: silent
triggers:
  # Styrbar (E2001/E2002)
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "on"
    id: press-on-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "off"
    id: press-off-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_up
    id: hold-up-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_down
    id: hold-down-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_stop
    id: release-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_click
    id: press-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_hold
    id: hold-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_release
    id: release-hold-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_click
    id: press-arrow-right-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_hold
    id: hold-arrow-right-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_release
    id: release-hold-arrow-right-z2m-e2001-e2002
variables:
  helper_color_mode: !input helper_color_mode
  helper_color_mode_entity: !input helper_color_mode_entity
  helper_default_hue: !input helper_default_hue
  helper_force_brightness: !input helper_force_brightness
  helper_force_temperature: !input helper_force_temperature
  helper_hold_delay: !input helper_hold_delay
  helper_hold_dim_step: 4
  helper_hold_temp_step: !input helper_temperature_step
  helper_hue_step: !input helper_hue_step
  helper_saturation: !input helper_saturation
  is_mqtt: "{{ trigger.platform == 'mqtt' }}"
  light: !input light
  mqtt_topic: "{{ trigger.topic }}"
  on_double_press_exposed: !input on_double_press_exposed
  off_double_press_exposed: !input off_double_press_exposed
  remote_devices: !input remote_devices
  remote_devices_names: "{{ remote_devices | map('device_attr', 'name') | map('regex_replace', find='^.*/', replace='', ignorecase=False) | list }}"
  effective_color_mode: >-
    {% if helper_color_mode_entity is defined and helper_color_mode_entity not in ['', none, 'unknown'] %}
      {{ 'rgb' if is_state(helper_color_mode_entity, 'on') else 'temperature' }}
    {% else %}
      {{ helper_color_mode }}
    {% endif %}
condition:
  - condition: template
    value_template: >-
      {{
        (trigger.topic.split('/')[2] in remote_devices_names if is_mqtt)
      }}
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - press-on-z2m-e2001-e2002
        sequence:
          - if:
              - condition: template
                value_template: "{{ on_double_press_exposed }}"
            then:
              - wait_for_trigger:
                  - trigger: mqtt
                    topic: "{{ mqtt_topic }}"
                    payload: "on"
                timeout:
                  milliseconds: !input helper_double_press_delay
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger.idx is defined }}"
                then:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ effective_color_mode == 'rgb' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light
                            data:
                              brightness_pct: !input helper_brightness
                              hs_color:
                                - "{{ helper_default_hue }}"
                                - "{{ helper_saturation }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light
                        data:
                          brightness_pct: !input helper_brightness
                          color_temp_kelvin: !input helper_temperature
                else:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ helper_force_brightness and helper_force_temperature }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light
                            data:
                              brightness_pct: !input helper_brightness
                              color_temp_kelvin: !input helper_temperature
                      - conditions:
                          - condition: template
                            value_template: "{{ helper_force_brightness }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light
                            data:
                              brightness_pct: !input helper_brightness
                      - conditions:
                          - condition: template
                            value_template: "{{ helper_force_temperature }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light
                            data:
                              color_temp_kelvin: !input helper_temperature
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light
                        data: {}
            else:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ helper_force_brightness and helper_force_temperature }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: !input light
                        data:
                          brightness_pct: !input helper_brightness
                          color_temp_kelvin: !input helper_temperature
                  - conditions:
                      - condition: template
                        value_template: "{{ helper_force_brightness }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: !input light
                        data:
                          brightness_pct: !input helper_brightness
                  - conditions:
                      - condition: template
                        value_template: "{{ helper_force_temperature }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: !input light
                        data:
                          color_temp_kelvin: !input helper_temperature
                default:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data: {}
      - conditions:
          - condition: trigger
            id:
              - press-off-z2m-e2001-e2002
        sequence:
          - if:
              - condition: template
                value_template: "{{ off_double_press_exposed }}"
            then:
              - wait_for_trigger:
                  - trigger: mqtt
                    topic: "{{ mqtt_topic }}"
                    payload: "off"
                timeout:
                  milliseconds: !input helper_double_press_delay
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger.idx is defined }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ helper_color_mode_entity is defined and helper_color_mode_entity not in ['', none, 'unknown'] }}"
                    then:
                      - action: input_boolean.toggle
                        target:
                          entity_id: !input helper_color_mode_entity
                else:
                  - action: light.turn_off
                    target:
                      entity_id: !input light
                    data: {}
            else:
              - action: light.turn_off
                target:
                  entity_id: !input light
                data: {}
      - conditions:
          - condition: trigger
            id:
              - press-arrow-left-z2m-e2001-e2002
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ effective_color_mode == 'rgb' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      hs_color:
                        - "{{ ((state_attr(light, 'hs_color')[0] | float(0) - helper_hue_step) % 360) }}"
                        - "{{ helper_saturation }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data:
                  color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int - helper_hold_temp_step, 2000] | max }}"
      - conditions:
          - condition: trigger
            id:
              - press-arrow-right-z2m-e2001-e2002
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ effective_color_mode == 'rgb' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      hs_color:
                        - "{{ ((state_attr(light, 'hs_color')[0] | float(0) + helper_hue_step) % 360) }}"
                        - "{{ helper_saturation }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data:
                  color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int + helper_hold_temp_step, 6500] | min }}"
      #
      # Actions for up button long press
      - conditions:
          - condition: trigger
            id:
              - hold-up-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - action: light.turn_on
                          target:
                            entity_id: !input light
                          data:
                            brightness_step_pct: "{{ helper_hold_dim_step }}"
                            transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-up-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      - conditions:
          - condition: trigger
            id:
              - hold-down-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - action: light.turn_on
                          target:
                            entity_id: !input light
                          data:
                            brightness_step_pct: "{{ helper_hold_dim_step | int * -1 }}"
                            transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-down-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      - conditions:
          - condition: trigger
            id:
              - hold-arrow-left-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ effective_color_mode == 'rgb' }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: !input light
                                  data:
                                    hs_color:
                                      - "{{ ((state_attr(light, 'hs_color')[0] | float(0) - helper_hue_step) % 360) }}"
                                      - "{{ helper_saturation }}"
                                    transition: "{{ helper_hold_delay / 1000 }}"
                          default:
                            - action: light.turn_on
                              target:
                                entity_id: !input light
                              data:
                                color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int - helper_hold_temp_step, 2000] | max }}"
                                transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-arrow-left-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "arrow_left_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      - conditions:
          - condition: trigger
            id:
              - hold-arrow-right-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ effective_color_mode == 'rgb' }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: !input light
                                  data:
                                    hs_color:
                                      - "{{ ((state_attr(light, 'hs_color')[0] | float(0) + helper_hue_step) % 360) }}"
                                      - "{{ helper_saturation }}"
                                    transition: "{{ helper_hold_delay / 1000 }}"
                          default:
                            - action: light.turn_on
                              target:
                                entity_id: !input light
                              data:
                                color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int + helper_hold_temp_step, 6500] | min }}"
                                transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-arrow-right-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "arrow_right_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
