blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: Ikea's Styrbar 💡 Light control
  description: |
    ## 💡 IKEA STYRBAR – Smart Light Control for Home Assistant

    Control your lights using the **IKEA STYRBAR Remote (E2001/E2002)** via Zigbee2MQTT.
    This blueprint combines simple setup with advanced options — perfect for intuitive and smooth light control.

    ---

    ### 🧠 Features
    - 💡 Turn lights **on/off**
    - 🔆 Adjust **brightness** (tap or hold)
    - 🌡️ Change **color temperature** (left = warmer 🔥, right = cooler ❄️) or **RGB hue** 🌈
    - ⏩ **Double press ON** to apply default values (brightness + temperature or brightness + RGB)
    - 🔄 Optional **color mode switch** via double press OFF (Temperature ↔ RGB)
    - 📱 Supports **multiple remotes** controlling the same light

    ---

    ### 🎛️ Button Layout

    | Button | Single Press | Double Press | Hold |
    |:-------|:-------------|:------------|:-----|
    | 🔼 **Top (ON)** | Turn on | Apply default brightness + color values | Increase brightness |
    | 🔽 **Bottom (OFF)** | Turn off | Switch to opposite color mode 🔄 | Decrease brightness |
    | ◀ **Left** | Warmer 🔥 / previous hue | — | Continuously adjust left |
    | ▶ **Right** | Cooler ❄️ / next hue | — | Continuously adjust right |

    ---

    ### ⚙️ Compatibility
    - 🧩 **Integration:** Zigbee2MQTT (`integration: mqtt`)
    - 💬 Not compatible with ZHA
    - Supports both `E2001` and `E2002` models

    ---

    ### 🔄 Double Press
    Enable **Expose double press ON** and adjust the **Double press delay**
    if needed. Enable **Color mode switch** to allow double press OFF
    to toggle between Temperature and RGB mode.
    Increase the delay if double press is not detected reliably.

    ---

    ✨ Created by **st0o0**
  input:
    remote_devices:
      name: 📱 Remotes
      description: >
        One or more IKEA STYRBAR remotes (E2001/E2002) paired via Zigbee2MQTT.
      default: []
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control (E2001/E2002)
          multiple: true
    light:
      name: 💡 Light
      description: The light entity to control with this remote.
      selector:
        entity:
          filter:
            domain: light
          multiple: false
    color_mode_section:
      name: 🎨 Color mode
      icon: mdi:palette
      collapsed: true
      input:
        helper_color_mode:
          name: Color mode
          description: >
            Controls what the **left/right arrow buttons** adjust.
            **Temperature** adjusts warm/cool white (Kelvin),
            **RGB** cycles through hue colors.
          default: temperature
          selector:
            select:
              options:
                - label: "Color Temperature (Kelvin)"
                  value: temperature
                - label: "RGB Color (Hue)"
                  value: rgb
              mode: dropdown
    default_values_section:
      name: 🎯 Default values
      icon: mdi:tune-variant
      collapsed: true
      input:
        helper_brightness:
          name: Brightness
          description: >
            Default brightness applied by **double press ON**
            and when switching color modes.
          default: 50
          selector:
            number:
              unit_of_measurement: "%"
              min: 1.0
              max: 100.0
              step: 1.0
              mode: slider
        helper_temperature:
          name: Color temperature
          description: >
            Default color temperature applied by **double press ON**
            in Temperature mode and when switching to Temperature mode.
          default: 2700
          selector:
            number:
              unit_of_measurement: "K"
              min: 2000
              max: 6500
              step: 100
              mode: slider
        helper_default_hue:
          name: Hue
          description: >
            Default hue value (0–360) applied by **double press ON**
            in RGB mode and when switching to RGB mode.
          default: 30
          selector:
            number:
              unit_of_measurement: "°"
              min: 0
              max: 360
              step: 5
              mode: slider
        helper_saturation:
          name: Saturation
          description: >
            Color saturation for RGB mode (100 = fully saturated).
            Applied by **double press ON** in RGB mode
            and when switching to RGB mode.
          default: 100
          selector:
            number:
              unit_of_measurement: "%"
              min: 10
              max: 100
              step: 5
              mode: slider
    step_sizes_section:
      name: 🔧 Step sizes
      icon: mdi:arrow-left-right
      collapsed: true
      input:
        helper_temperature_step:
          name: Temperature step size
          description: >
            How much the color temperature changes per arrow press or hold step.
            Smaller values give smoother transitions, larger values faster changes.
          default: 300
          selector:
            number:
              unit_of_measurement: "K"
              min: 50
              max: 700
              step: 50
              mode: slider
        helper_hue_step:
          name: Hue step size
          description: >
            How many degrees (0–360) the hue shifts per arrow press or hold step.
            Smaller values give smoother transitions, larger values more dramatic jumps.
          default: 30
          selector:
            number:
              unit_of_measurement: "°"
              min: 5
              max: 90
              step: 5
              mode: slider
    options_section:
      name: ⏱️ Double press & timing
      icon: mdi:remote
      collapsed: true
      input:
        on_double_press_exposed:
          name: Expose double press ON
          description: >
            Enable **double press** detection on the **ON** button.
            Double pressing applies the configured default values.
            Adds a small delay to single press detection.
          default: false
          selector:
            boolean: {}
        helper_enable_mode_switch:
          name: Enable color mode switch
          description: >
            Enable **double press OFF** to switch the light between color modes
            (Temperature → RGB, RGB → Temperature).
            When enabled, double press detection on the OFF button is automatically active.
          default: false
          selector:
            boolean: {}
        helper_last_controller_event:
          name: Last controller event helper
          description: >
            An `input_text` helper used to store the last button event for
            double press detection. Create an `input_text` helper in Home Assistant
            and select it here. Each automation instance needs its own helper.
          default: []
          selector:
            entity:
              filter:
                domain: input_text
              multiple: false
        helper_double_press_delay:
          name: Double press delay
          description: >
            Maximum time between first and second press for double press detection.
            Increase if double press is not detected reliably.
          default: 500
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_hold_delay:
          name: Hold delay
          description: >
            Time between repeated actions while a button is held down.
            Lower values give faster response, higher values give more control.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_max_loops:
          name: Max hold loops
          description: >
            Maximum number of action repetitions while holding a button.
            Prevents infinite loops if button release is not detected.
          default: 20
          selector:
            number:
              min: 1.0
              max: 1000.0
              step: 1.0
              mode: slider
mode: restart
max_exceeded: silent
triggers:
  # Styrbar (E2001/E2002)
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "on"
    id: press-on-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "off"
    id: press-off-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_up
    id: hold-up-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_down
    id: hold-down-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_stop
    id: release-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_click
    id: press-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_hold
    id: hold-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_release
    id: release-hold-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_click
    id: press-arrow-right-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_hold
    id: hold-arrow-right-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_release
    id: release-hold-arrow-right-z2m-e2001-e2002
variables:
  helper_color_mode: !input helper_color_mode
  helper_default_hue: !input helper_default_hue
  helper_hold_delay: !input helper_hold_delay
  helper_hold_dim_step: 4
  helper_hold_temp_step: !input helper_temperature_step
  helper_hue_step: !input helper_hue_step
  helper_saturation: !input helper_saturation
  is_mqtt: "{{ trigger.platform == 'mqtt' }}"
  light: !input light
  mqtt_topic: "{{ trigger.topic }}"
  on_double_press_exposed: !input on_double_press_exposed
  helper_enable_mode_switch: !input helper_enable_mode_switch
  remote_devices: !input remote_devices
  remote_devices_names: "{{ remote_devices | map('device_attr', 'name') | map('regex_replace', find='^.*/', replace='', ignorecase=False) | list }}"
  trigger_action: "{{ trigger.payload | string }}"
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  last_stored: "{{ states(helper_last_controller_event) if (helper_last_controller_event is string and helper_last_controller_event | length > 0 and has_value(helper_last_controller_event)) else '' }}"
  last_action: "{{ (last_stored | string).split('|')[0] if '|' in (last_stored | string) else '' }}"
  last_topic: "{{ (last_stored | string).split('|')[1] if ((last_stored | string).split('|') | length) >= 3 else '' }}"
  last_timestamp: "{{ ((last_stored | string).split('|')[-1]) | float(0) }}"
  time_delta: "{{ as_timestamp(now()) - last_timestamp }}"
condition:
  - condition: template
    value_template: >-
      {{
        (trigger.topic.split('/')[2] in remote_devices_names if is_mqtt else false)
      }}
actions:
  - choose:
      # --- ON button ---
      - conditions:
          - condition: trigger
            id:
              - press-on-z2m-e2001-e2002
        sequence:
          - choose:
              # Double press detected
              - conditions:
                  - condition: template
                    value_template: "{{ on_double_press_exposed and (trigger_action | string) == (last_action | string) and mqtt_topic == last_topic and time_delta < (helper_double_press_delay / 1000) }}"
                sequence:
                  # Clear helper to prevent triple-press
                  - if:
                      - condition: template
                        value_template: "{{ helper_last_controller_event is string and helper_last_controller_event | length > 0 }}"
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: !input helper_last_controller_event
                        data:
                          value: ""
                  # Double press ON: apply standard values
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ helper_color_mode == 'rgb' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light
                            data:
                              brightness_pct: !input helper_brightness
                              hs_color:
                                - "{{ helper_default_hue }}"
                                - "{{ helper_saturation }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light
                        data:
                          brightness_pct: !input helper_brightness
                          color_temp_kelvin: !input helper_temperature
            default:
              # Store current event
              - if:
                  - condition: template
                    value_template: "{{ helper_last_controller_event is string and helper_last_controller_event | length > 0 }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: !input helper_last_controller_event
                    data:
                      value: "{{ (trigger.payload | string) ~ '|' ~ trigger.topic ~ '|' ~ (as_timestamp(now()) | string) }}"
              # Delay (killed by restart on second press)
              - if:
                  - condition: template
                    value_template: "{{ on_double_press_exposed }}"
                then:
                  - delay:
                      milliseconds: !input helper_double_press_delay
              # Single press ON
              - action: light.turn_on
                target:
                  entity_id: !input light
                data: {}
      # --- OFF button ---
      - conditions:
          - condition: trigger
            id:
              - press-off-z2m-e2001-e2002
        sequence:
          - choose:
              # Double press detected
              - conditions:
                  - condition: template
                    value_template: "{{ helper_enable_mode_switch and (trigger_action | string) == (last_action | string) and mqtt_topic == last_topic and time_delta < (helper_double_press_delay / 1000) }}"
                sequence:
                  # Clear helper to prevent triple-press
                  - if:
                      - condition: template
                        value_template: "{{ helper_last_controller_event is string and helper_last_controller_event | length > 0 }}"
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: !input helper_last_controller_event
                        data:
                          value: ""
                  # Double press OFF: toggle color mode
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ helper_color_mode == 'temperature' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light
                            data:
                              hs_color:
                                - "{{ helper_default_hue }}"
                                - "{{ helper_saturation }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light
                        data:
                          color_temp_kelvin: !input helper_temperature
            default:
              # Store current event
              - if:
                  - condition: template
                    value_template: "{{ helper_last_controller_event is string and helper_last_controller_event | length > 0 }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: !input helper_last_controller_event
                    data:
                      value: "{{ (trigger.payload | string) ~ '|' ~ trigger.topic ~ '|' ~ (as_timestamp(now()) | string) }}"
              # Delay (killed by restart on second press)
              - if:
                  - condition: template
                    value_template: "{{ helper_enable_mode_switch }}"
                then:
                  - delay:
                      milliseconds: !input helper_double_press_delay
              # Single press OFF
              - action: light.turn_off
                target:
                  entity_id: !input light
                data: {}
      # --- Arrow Left ---
      - conditions:
          - condition: trigger
            id:
              - press-arrow-left-z2m-e2001-e2002
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ helper_color_mode == 'rgb' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      hs_color:
                        - "{{ (((state_attr(light, 'hs_color') or [0,0])[0] | float(0) - helper_hue_step) % 360) }}"
                        - "{{ helper_saturation }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data:
                  color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int(2700) - helper_hold_temp_step, 2000] | max }}"
      # --- Arrow Right ---
      - conditions:
          - condition: trigger
            id:
              - press-arrow-right-z2m-e2001-e2002
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ helper_color_mode == 'rgb' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      hs_color:
                        - "{{ (((state_attr(light, 'hs_color') or [0,0])[0] | float(0) + helper_hue_step) % 360) }}"
                        - "{{ helper_saturation }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data:
                  color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int(2700) + helper_hold_temp_step, 6500] | min }}"
      # --- Hold UP ---
      - conditions:
          - condition: trigger
            id:
              - hold-up-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - action: light.turn_on
                          target:
                            entity_id: !input light
                          data:
                            brightness_step_pct: "{{ helper_hold_dim_step }}"
                            transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-up-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      # --- Hold DOWN ---
      - conditions:
          - condition: trigger
            id:
              - hold-down-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - action: light.turn_on
                          target:
                            entity_id: !input light
                          data:
                            brightness_step_pct: "{{ helper_hold_dim_step | int * -1 }}"
                            transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-down-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      # --- Hold Arrow Left ---
      - conditions:
          - condition: trigger
            id:
              - hold-arrow-left-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ helper_color_mode == 'rgb' }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: !input light
                                  data:
                                    hs_color:
                                      - "{{ (((state_attr(light, 'hs_color') or [0,0])[0] | float(0) - helper_hue_step) % 360) }}"
                                      - "{{ helper_saturation }}"
                                    transition: "{{ helper_hold_delay / 1000 }}"
                          default:
                            - action: light.turn_on
                              target:
                                entity_id: !input light
                              data:
                                color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int(2700) - helper_hold_temp_step, 2000] | max }}"
                                transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-arrow-left-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "arrow_left_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      # --- Hold Arrow Right ---
      - conditions:
          - condition: trigger
            id:
              - hold-arrow-right-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ helper_color_mode == 'rgb' }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: !input light
                                  data:
                                    hs_color:
                                      - "{{ (((state_attr(light, 'hs_color') or [0,0])[0] | float(0) + helper_hue_step) % 360) }}"
                                      - "{{ helper_saturation }}"
                                    transition: "{{ helper_hold_delay / 1000 }}"
                          default:
                            - action: light.turn_on
                              target:
                                entity_id: !input light
                              data:
                                color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int(2700) + helper_hold_temp_step, 6500] | min }}"
                                transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-arrow-right-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "arrow_right_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
