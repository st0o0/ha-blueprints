blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: Ikea's Styrbar 💡 Light control
  description: |
    ## 💡 IKEA STYRBAR – Smart Light Control for Home Assistant

    Control your lights using the **IKEA STYRBAR Remote (E2001/E2002)** via Zigbee2MQTT.
    This blueprint combines simple setup with advanced options — perfect for intuitive and smooth light control.

    ---

    ### 🧠 Features
    - 💡 Turn lights **on/off**
    - 🔆 Adjust **brightness** (tap or hold)
    - 🌡️ **Three color modes:** Temperature only, RGB only, or both (switchable)
    - ⏩ **Double press ON** to apply default values (brightness + color)
    - 🔄 **Double press OFF** to toggle between Temperature and RGB (when both modes active)
    - 📱 Supports **multiple remotes** controlling the same light

    ---

    ### 🎛️ Button Layout

    | Button | Single Press | Double Press | Hold |
    |:-------|:-------------|:------------|:-----|
    | 🔼 **Top (ON)** | Turn on | Apply default brightness + color values | Increase brightness |
    | 🔽 **Bottom (OFF)** | Turn off | Toggle color mode 🔄 (Temperature ↔ RGB) | Decrease brightness |
    | ◀ **Left** | Warmer 🔥 / previous hue | — | Continuously adjust left |
    | ▶ **Right** | Cooler ❄️ / next hue | — | Continuously adjust right |

    ---

    ### ⚙️ Compatibility
    - 🧩 **Integration:** Zigbee2MQTT (`integration: mqtt`)
    - 💬 Not compatible with ZHA
    - Supports both `E2001` and `E2002` models

    ---

    ### 🔄 Double Press
    Enable **Expose double press ON** to apply default values.
    Set color mode to **Temperature + RGB** to enable double press OFF
    for mode switching. Increase the **Double press time window** if
    double press is not detected reliably (STYRBAR: use 1000ms+).

    ---

    ✨ Created by **st0o0**
  input:
    remote_devices:
      name: 📱 Remotes
      description: >
        One or more IKEA STYRBAR remotes (E2001/E2002) paired via Zigbee2MQTT.
      default: []
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control (E2001/E2002)
          multiple: true
    light:
      name: 💡 Light
      description: The light entity to control with this remote.
      selector:
        entity:
          filter:
            domain: light
          multiple: false
    color_mode_section:
      name: 🎨 Color mode
      icon: mdi:palette
      collapsed: true
      input:
        helper_color_mode:
          name: Color mode
          description: >
            **Temperature only** — arrows adjust warm/cool white (Kelvin).
            **RGB only** — arrows cycle through hue colors.
            **Temperature + RGB** — both modes, switchable via double press OFF.
          default: temperature
          selector:
            select:
              options:
                - label: "Temperature only"
                  value: temperature
                - label: "RGB only"
                  value: rgb
                - label: "Temperature + RGB (switchable)"
                  value: both
              mode: dropdown
        helper_mode_switch_effect:
          name: Mode switch effect
          description: >
            What happens to the light when switching modes via double press OFF.
            Only relevant when color mode is **Temperature + RGB**.
            **Apply defaults** sets brightness and color.
            **Color only** changes only the color, keeping current brightness.
          default: apply_defaults
          selector:
            select:
              options:
                - label: "Apply defaults (brightness + color)"
                  value: apply_defaults
                - label: "Color only (keep brightness)"
                  value: color_only
              mode: dropdown
    default_values_section:
      name: 🎯 Default values
      icon: mdi:tune-variant
      collapsed: true
      input:
        helper_brightness:
          name: Brightness
          description: >
            Default brightness applied by **double press ON**
            and when switching color modes.
          default: 50
          selector:
            number:
              unit_of_measurement: "%"
              min: 1.0
              max: 100.0
              step: 1.0
              mode: slider
        helper_temperature:
          name: Color temperature
          description: >
            Default color temperature. Used by **double press ON**
            in Temperature mode and when switching to Temperature mode.
            Not used when color mode is **RGB only**.
          default: 2700
          selector:
            number:
              unit_of_measurement: "K"
              min: 2000
              max: 6500
              step: 100
              mode: slider
        helper_default_hue:
          name: Hue
          description: >
            Default hue (0–360). Used by **double press ON**
            in RGB mode and when switching to RGB mode.
            Not used when color mode is **Temperature only**.
          default: 30
          selector:
            number:
              unit_of_measurement: "°"
              min: 0
              max: 360
              step: 5
              mode: slider
        helper_saturation:
          name: Saturation
          description: >
            Color saturation for RGB mode (100 = fully saturated).
            Not used when color mode is **Temperature only**.
          default: 100
          selector:
            number:
              unit_of_measurement: "%"
              min: 10
              max: 100
              step: 5
              mode: slider
    step_sizes_section:
      name: 🔧 Step sizes
      icon: mdi:arrow-left-right
      collapsed: true
      input:
        helper_temperature_step:
          name: Temperature step size
          description: >
            How much the color temperature changes per arrow press or hold step.
            Not used when color mode is **RGB only**.
          default: 300
          selector:
            number:
              unit_of_measurement: "K"
              min: 50
              max: 700
              step: 50
              mode: slider
        helper_hue_step:
          name: Hue step size
          description: >
            How many degrees the hue shifts per arrow press or hold step.
            Not used when color mode is **Temperature only**.
          default: 30
          selector:
            number:
              unit_of_measurement: "°"
              min: 5
              max: 90
              step: 5
              mode: slider
    options_section:
      name: ⏱️ Double press & timing
      icon: mdi:remote
      collapsed: true
      input:
        on_double_press_exposed:
          name: Expose double press ON
          description: >
            Enable **double press** detection on the **ON** button.
            Double pressing applies the configured default values.
            Single press still fires immediately — no delay.
          default: false
          selector:
            boolean: {}
        helper_last_controller_event:
          name: Last controller event helper
          description: >
            An `input_text` helper used to store the last button event for
            double press detection. Create an `input_text` helper in Home Assistant
            and select it here. Each automation instance needs its own helper.
          default: []
          selector:
            entity:
              filter:
                domain: input_text
              multiple: false
        helper_double_press_delay:
          name: Double press time window
          description: >
            Maximum time between first and second press for double press detection.
            Increase if double press is not detected reliably.
            STYRBAR ON/OFF buttons have heavy firmware debounce — use 1000ms or more.
          default: 1000
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_hold_delay:
          name: Hold delay
          description: >
            Time between repeated actions while a button is held down.
            Lower values give faster response, higher values give more control.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_max_loops:
          name: Max hold loops
          description: >
            Maximum number of action repetitions while holding a button.
            Prevents infinite loops if button release is not detected.
          default: 20
          selector:
            number:
              min: 1.0
              max: 1000.0
              step: 1.0
              mode: slider
mode: restart
max_exceeded: silent
triggers:
  # Styrbar (E2001/E2002)
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "on"
    id: press-on-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "off"
    id: press-off-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_up
    id: hold-up-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_down
    id: hold-down-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_stop
    id: release-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_click
    id: press-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_hold
    id: hold-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_release
    id: release-hold-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_click
    id: press-arrow-right-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_hold
    id: hold-arrow-right-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_release
    id: release-hold-arrow-right-z2m-e2001-e2002
variables:
  helper_color_mode: !input helper_color_mode
  helper_mode_switch_effect: !input helper_mode_switch_effect
  color_mode: "{{ ('rgb' if (state_attr(light, 'color_mode') | default('color_temp')) != 'color_temp' else 'temperature') if helper_color_mode == 'both' else helper_color_mode }}"
  helper_default_hue: !input helper_default_hue
  helper_hold_delay: !input helper_hold_delay
  helper_hold_dim_step: 4
  helper_hold_temp_step: !input helper_temperature_step
  helper_hue_step: !input helper_hue_step
  helper_saturation: !input helper_saturation
  is_mqtt: "{{ trigger.platform == 'mqtt' }}"
  light: !input light
  mqtt_topic: "{{ trigger.topic }}"
  on_double_press_exposed: !input on_double_press_exposed
  remote_devices: !input remote_devices
  remote_devices_names: "{{ remote_devices | map('device_attr', 'name') | map('regex_replace', find='^.*/', replace='', ignorecase=False) | list }}"
  trigger_action: "{{ trigger.payload | string }}"
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  last_stored: "{{ states(helper_last_controller_event) if (helper_last_controller_event is string and helper_last_controller_event | length > 0 and has_value(helper_last_controller_event)) else '' }}"
  last_action: "{{ (last_stored | string).split('|')[0] if '|' in (last_stored | string) else '' }}"
  last_topic: "{{ (last_stored | string).split('|')[1] if ((last_stored | string).split('|') | length) >= 3 else '' }}"
  last_timestamp: "{{ ((last_stored | string).split('|')[-1]) | float(0) }}"
  time_delta: "{{ as_timestamp(now()) - last_timestamp }}"
condition:
  - condition: template
    value_template: >-
      {{
        (trigger.topic.split('/')[2] in remote_devices_names if is_mqtt else false)
      }}
actions:
  - choose:
      # --- ON button ---
      - conditions:
          - condition: trigger
            id:
              - press-on-z2m-e2001-e2002
        sequence:
          - choose:
              # Double press detected
              - conditions:
                  - condition: template
                    value_template: "{{ on_double_press_exposed and (trigger_action | string) == (last_action | string) and mqtt_topic == last_topic and time_delta < (helper_double_press_delay / 1000) }}"
                sequence:
                  # Clear helper to prevent triple-press
                  - if:
                      - condition: template
                        value_template: "{{ helper_last_controller_event is string and helper_last_controller_event | length > 0 }}"
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: !input helper_last_controller_event
                        data:
                          value: ""
                  # Double press ON: apply standard values
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ color_mode == 'rgb' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light
                            data:
                              brightness_pct: !input helper_brightness
                              hs_color:
                                - "{{ helper_default_hue }}"
                                - "{{ helper_saturation }}"
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light
                        data:
                          brightness_pct: !input helper_brightness
                          color_temp_kelvin: !input helper_temperature
            default:
              # Store current event
              - if:
                  - condition: template
                    value_template: "{{ helper_last_controller_event is string and helper_last_controller_event | length > 0 }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: !input helper_last_controller_event
                    data:
                      value: "{{ (trigger.payload | string) ~ '|' ~ trigger.topic ~ '|' ~ (as_timestamp(now()) | string) }}"
              # Single press ON
              - action: light.turn_on
                target:
                  entity_id: !input light
                data: {}
      # --- OFF button ---
      - conditions:
          - condition: trigger
            id:
              - press-off-z2m-e2001-e2002
        sequence:
          - choose:
              # Double press detected
              - conditions:
                  - condition: template
                    value_template: "{{ helper_color_mode == 'both' and (trigger_action | string) == (last_action | string) and mqtt_topic == last_topic and time_delta < (helper_double_press_delay / 1000) }}"
                sequence:
                  # Clear helper to prevent triple-press
                  - if:
                      - condition: template
                        value_template: "{{ helper_last_controller_event is string and helper_last_controller_event | length > 0 }}"
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: !input helper_last_controller_event
                        data:
                          value: ""
                  # Apply mode switch effect
                  - choose:
                      # Switching from temperature → RGB
                      - conditions:
                          - condition: template
                            value_template: "{{ color_mode == 'temperature' }}"
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ helper_mode_switch_effect == 'apply_defaults' }}"
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input light
                                    data:
                                      brightness_pct: !input helper_brightness
                                      hs_color:
                                        - "{{ helper_default_hue }}"
                                        - "{{ helper_saturation }}"
                            default:
                              - action: light.turn_on
                                target:
                                  entity_id: !input light
                                data:
                                  hs_color:
                                    - "{{ helper_default_hue }}"
                                    - "{{ helper_saturation }}"
                    # Switching from RGB → temperature
                    default:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ helper_mode_switch_effect == 'apply_defaults' }}"
                            sequence:
                              - action: light.turn_on
                                target:
                                  entity_id: !input light
                                data:
                                  brightness_pct: !input helper_brightness
                                  color_temp_kelvin: !input helper_temperature
                        default:
                          - action: light.turn_on
                            target:
                              entity_id: !input light
                            data:
                              color_temp_kelvin: !input helper_temperature
            default:
              # Store current event
              - if:
                  - condition: template
                    value_template: "{{ helper_last_controller_event is string and helper_last_controller_event | length > 0 }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: !input helper_last_controller_event
                    data:
                      value: "{{ (trigger.payload | string) ~ '|' ~ trigger.topic ~ '|' ~ (as_timestamp(now()) | string) }}"
              # Single press OFF
              - action: light.turn_off
                target:
                  entity_id: !input light
                data: {}
      # --- Arrow Left ---
      - conditions:
          - condition: trigger
            id:
              - press-arrow-left-z2m-e2001-e2002
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ color_mode == 'rgb' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      hs_color:
                        - "{{ (((state_attr(light, 'hs_color') or [0,0])[0] | float(0) - helper_hue_step) % 360) }}"
                        - "{{ helper_saturation }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data:
                  color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int(2700) - helper_hold_temp_step, 2000] | max }}"
      # --- Arrow Right ---
      - conditions:
          - condition: trigger
            id:
              - press-arrow-right-z2m-e2001-e2002
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ color_mode == 'rgb' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      hs_color:
                        - "{{ (((state_attr(light, 'hs_color') or [0,0])[0] | float(0) + helper_hue_step) % 360) }}"
                        - "{{ helper_saturation }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light
                data:
                  color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int(2700) + helper_hold_temp_step, 6500] | min }}"
      # --- Hold UP ---
      - conditions:
          - condition: trigger
            id:
              - hold-up-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - action: light.turn_on
                          target:
                            entity_id: !input light
                          data:
                            brightness_step_pct: "{{ helper_hold_dim_step }}"
                            transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-up-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      # --- Hold DOWN ---
      - conditions:
          - condition: trigger
            id:
              - hold-down-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - action: light.turn_on
                          target:
                            entity_id: !input light
                          data:
                            brightness_step_pct: "{{ helper_hold_dim_step | int * -1 }}"
                            transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-down-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      # --- Hold Arrow Left ---
      - conditions:
          - condition: trigger
            id:
              - hold-arrow-left-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ color_mode == 'rgb' }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: !input light
                                  data:
                                    hs_color:
                                      - "{{ (((state_attr(light, 'hs_color') or [0,0])[0] | float(0) - helper_hue_step) % 360) }}"
                                      - "{{ helper_saturation }}"
                                    transition: "{{ helper_hold_delay / 1000 }}"
                          default:
                            - action: light.turn_on
                              target:
                                entity_id: !input light
                              data:
                                color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int(2700) - helper_hold_temp_step, 2000] | max }}"
                                transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-arrow-left-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "arrow_left_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      # --- Hold Arrow Right ---
      - conditions:
          - condition: trigger
            id:
              - hold-arrow-right-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ color_mode == 'rgb' }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: !input light
                                  data:
                                    hs_color:
                                      - "{{ (((state_attr(light, 'hs_color') or [0,0])[0] | float(0) + helper_hue_step) % 360) }}"
                                      - "{{ helper_saturation }}"
                                    transition: "{{ helper_hold_delay / 1000 }}"
                          default:
                            - action: light.turn_on
                              target:
                                entity_id: !input light
                              data:
                                color_temp_kelvin: "{{ [state_attr(light, 'color_temp_kelvin') | int(2700) + helper_hold_temp_step, 6500] | min }}"
                                transition: "{{ helper_hold_delay / 1000 }}"
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-arrow-right-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "arrow_right_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
