blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: Ikea's Styrbar ⚙️ Controls
  description: |
    ## ⚙️ IKEA STYRBAR – Universal Remote Control for Home Assistant

    Assign **any Home Assistant action** to every button of the **IKEA STYRBAR Remote (E2001/E2002)** via Zigbee2MQTT.
    Full flexibility for single press, double press, and hold — perfect for lights, scenes, scripts, or automations.

    ---

    ### 🧠 Features
    - 🎯 **Custom actions** for every button event (press, hold, double press)
    - ⏩ **Virtual double press** detection with configurable delay
    - 🔁 **Hold repeat** with adjustable delay and max loop count
    - 📱 Supports **multiple remotes** controlling the same targets

    ---

    ### 🎛️ Button Layout

    | Button | Single Press | Double Press | Hold |
    |:-------|:-------------|:------------|:-----|
    | 🔼 **Top (ON)** | Custom action | Custom action (optional) | Custom action (repeated) |
    | 🔽 **Bottom (OFF)** | Custom action | Custom action (optional) | Custom action (repeated) |
    | ◀ **Left** | Custom action | Custom action (optional) | Custom action (repeated) |
    | ▶ **Right** | Custom action | Custom action (optional) | Custom action (repeated) |

    ---

    ### ⚙️ Compatibility
    - 🧩 **Integration:** Zigbee2MQTT (`integration: mqtt`)
    - 💬 Not compatible with ZHA
    - Supports both `E2001` and `E2002` models

    ---

    ### 💡 Example Use Cases
    - Toggle lights on/off and adjust brightness with hold
    - Cycle through favorite scenes with arrow buttons
    - Double press to trigger special automations or modes
    - Control multiple rooms from one remote

    ---

    ✨ Created by **st0o0**
  input:
    remote_devices:
      name: 📱 Remotes
      description: >
        One or more IKEA STYRBAR remotes (E2001/E2002) paired via Zigbee2MQTT.
      default: []
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control
            # DEPRECATED - for removal, keeping for z2m v1 backward compatibility
            - integration: mqtt
              manufacturer: IKEA
              model: STYRBAR remote control (E2001/E2002)
          multiple: true
    on_press_action:
      name: 🔼 Press ON action
      description: Action(s) to run when the **ON** button is **pressed**.
      default: []
      selector:
        action: {}
    off_press_action:
      name: 🔽 Press OFF action
      description: Action(s) to run when the **OFF** button is **pressed**.
      default: []
      selector:
        action: {}
    on_hold_action:
      name: 🔼 Hold ON action
      description: Action(s) to run repeatedly when the **ON** button is **held**.
      default: []
      selector:
        action: {}
    off_hold_action:
      name: 🔽 Hold OFF action
      description: Action(s) to run repeatedly when the **OFF** button is **held**.
      default: []
      selector:
        action: {}
    arrow_left_press_action:
      name: ◀ Press Left action
      description: Action(s) to run when the **Left arrow** button is **pressed**.
      default: []
      selector:
        action: {}
    arrow_right_press_action:
      name: ▶ Press Right action
      description: Action(s) to run when the **Right arrow** button is **pressed**.
      default: []
      selector:
        action: {}
    arrow_left_hold_action:
      name: ◀ Hold Left action
      description: Action(s) to run repeatedly when the **Left arrow** button is **held**.
      default: []
      selector:
        action: {}
    arrow_right_hold_action:
      name: ▶ Hold Right action
      description: Action(s) to run repeatedly when the **Right arrow** button is **held**.
      default: []
      selector:
        action: {}
    on_double_press_action:
      name: ⏩ Double press ON action
      description: >
        Action(s) to run when the **ON** button is **pressed twice**.
        Requires **Expose double press ON** to be enabled.
      default: []
      selector:
        action: {}
    off_double_press_action:
      name: ⏩ Double press OFF action
      description: >
        Action(s) to run when the **OFF** button is **pressed twice**.
        Requires **Expose double press OFF** to be enabled.
      default: []
      selector:
        action: {}
    arrow_left_click_double_press_action:
      name: ⏩ Double press Left action
      description: >
        Action(s) to run when the **Left arrow** button is **pressed twice**.
        Requires **Expose double press ON** to be enabled.
      default: []
      selector:
        action: {}
    arrow_right_click_double_press_action:
      name: ⏩ Double press Right action
      description: >
        Action(s) to run when the **Right arrow** button is **pressed twice**.
        Requires **Expose double press ON** to be enabled.
      default: []
      selector:
        action: {}
    helper_section:
      name: ⏱️ Timing
      icon: mdi:cog-outline
      collapsed: true
      input:
        helper_hold_delay:
          name: Hold delay
          description: >
            Time between repeated actions while a button is held down.
            Lower values give faster response, higher values give more control.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_max_loops:
          name: Max hold loops
          description: >
            Maximum number of action repetitions while holding a button.
            Prevents infinite loops if button release is not detected.
          default: 20
          selector:
            number:
              min: 1.0
              max: 1000.0
              step: 1.0
              mode: slider
    styrbar_options_section:
      name: 🔄 Double press options
      icon: mdi:remote
      collapsed: true
      input:
        on_double_press_exposed:
          name: Expose double press ON
          description: >
            Enable virtual **double press** detection for the **ON** and **arrow** buttons.
            Adds a small delay to single press detection.
          default: false
          selector:
            boolean: {}
        off_double_press_exposed:
          name: Expose double press OFF
          description: >
            Enable virtual **double press** detection for the **OFF** button.
            Adds a small delay to single press detection.
          default: false
          selector:
            boolean: {}
        helper_double_press_delay:
          name: Double press delay
          description: >
            Maximum time between first and second press for double press detection.
            Increase if double press is not detected reliably.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
mode: restart
max_exceeded: silent
triggers:
  # Styrbar (E2001/E2002)
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "on"
    id: press-on-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: "off"
    id: press-off-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_up
    id: hold-up-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_move_down
    id: hold-down-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: brightness_stop
    id: release-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_click
    id: press-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_hold
    id: hold-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_left_release
    id: release-hold-arrow-left-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_click
    id: press-arrow-right-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_hold
    id: hold-arrow-right-z2m-e2001-e2002
  - trigger: mqtt
    topic: "+/+/+/action"
    payload: arrow_right_release
    id: release-hold-arrow-right-z2m-e2001-e2002
variables:
  is_mqtt: "{{ trigger.platform == 'mqtt' }}"
  mqtt_topic: "{{ trigger.topic }}"
  on_double_press_exposed: !input on_double_press_exposed
  off_double_press_exposed: !input off_double_press_exposed
  remote_devices: !input remote_devices
  remote_devices_names: "{{ remote_devices | map('device_attr', 'name') | map('regex_replace', find='^.*/', replace='', ignorecase=False) | list }}"
condition:
  - condition: template
    value_template: >-
      {{
        (trigger.topic.split('/')[2] in remote_devices_names if is_mqtt)
      }}
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - press-on-z2m-e2001-e2002
        sequence:
          - if:
              - condition: template
                value_template: "{{ on_double_press_exposed }}"
            then:
              - choose:
                  - conditions:
                      - condition: trigger
                        id:
                          - press-on-z2m-e2001-e2002
                    sequence:
                      - wait_for_trigger:
                          - trigger: mqtt
                            topic: "{{ mqtt_topic }}"
                            payload: "on"
                        timeout:
                          milliseconds: !input helper_double_press_delay
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: "{{ wait.trigger.idx is defined }}"
                        then: !input on_double_press_action
                        else: !input on_press_action
                default: !input on_press_action
            else: !input on_press_action
      - conditions:
          - condition: trigger
            id:
              - press-off-z2m-e2001-e2002
        sequence:
          - if:
              - condition: template
                value_template: "{{ off_double_press_exposed }}"
            then:
              - choose:
                  - conditions:
                      - condition: trigger
                        id:
                          - press-off-z2m-e2001-e2002
                    sequence:
                      - wait_for_trigger:
                          - trigger: mqtt
                            topic: "{{ mqtt_topic }}"
                            payload: "off"
                        timeout:
                          milliseconds: !input helper_double_press_delay
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: "{{ wait.trigger.idx is defined }}"
                        then: !input off_double_press_action
                        else: !input off_press_action
                default: !input off_press_action
            else: !input off_press_action
      - conditions:
          - condition: trigger
            id:
              - press-arrow-left-z2m-e2001-e2002
        sequence:
          - if:
              - condition: template
                value_template: "{{ on_double_press_exposed }}"
            then:
              - choose:
                  - conditions:
                      - condition: trigger
                        id:
                          - press-arrow-left-z2m-e2001-e2002
                    sequence:
                      - wait_for_trigger:
                          - trigger: mqtt
                            topic: "{{ mqtt_topic }}"
                            payload: "arrow_left_click"
                        timeout:
                          milliseconds: !input helper_double_press_delay
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: "{{ wait.trigger.idx is defined }}"
                        then: !input arrow_left_click_double_press_action
                        else: !input arrow_left_press_action
                default: !input arrow_left_press_action
            else: !input arrow_left_press_action
      - conditions:
          - condition: trigger
            id:
              - press-arrow-right-z2m-e2001-e2002
        sequence:
          - if:
              - condition: template
                value_template: "{{ on_double_press_exposed }}"
            then:
              - choose:
                  - conditions:
                      - condition: trigger
                        id:
                          - press-arrow-right-z2m-e2001-e2002
                    sequence:
                      - wait_for_trigger:
                          - trigger: mqtt
                            topic: "{{ mqtt_topic }}"
                            payload: "arrow_right_click"
                        timeout:
                          milliseconds: !input helper_double_press_delay
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: "{{ wait.trigger.idx is defined }}"
                        then: !input arrow_right_click_double_press_action
                        else: !input arrow_right_press_action
                default: !input arrow_right_press_action
            else: !input arrow_right_press_action
      #
      # Actions for up button long press
      - conditions:
          - condition: trigger
            id:
              - hold-up-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence: !input on_hold_action
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-up-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      - conditions:
          - condition: trigger
            id:
              - hold-down-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence: !input off_hold_action
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-down-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "brightness_stop"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      - conditions:
          - condition: trigger
            id:
              - hold-arrow-left-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence: !input arrow_left_hold_action
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-arrow-left-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "arrow_left_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
      - conditions:
          - condition: trigger
            id:
              - hold-arrow-right-z2m-e2001-e2002
        sequence:
          - repeat:
              count: !input helper_max_loops
              sequence:
                - parallel:
                    - sequence: !input arrow_right_hold_action
                    - sequence:
                        - choose:
                            - conditions:
                                - condition: trigger
                                  id:
                                    - hold-arrow-right-z2m-e2001-e2002
                              sequence:
                                - wait_for_trigger:
                                    - trigger: mqtt
                                      topic: "{{ mqtt_topic }}"
                                      payload: "arrow_right_release"
                                  timeout:
                                    milliseconds: !input helper_hold_delay
                                  continue_on_timeout: true
                                - if:
                                    - condition: template
                                      value_template: "{{ wait.trigger.idx is defined }}"
                                  then:
                                    - stop: button released
