blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: "\U0001F327 ha-njord Rain Warning for Open Windows"
  description: |
    ## 🌧️ Rain Warning for Open Windows — ha-njord

    Warns when rain is approaching and windows are still open — so you can
    close them before it starts. Powered by `ha-njord`'s weather trend sensor.

    ---

    ### 🧠 Features
    - 📊 Monitors `sensor.*_weather_trend` for `precip_starts_in_hours`
    - 🪟 Checks a configurable list of window sensors (any `binary_sensor`)
    - 📋 Lists affected (open) windows by friendly name in the notification
    - 🔔 Single notification per location — updates in place via stable tag
    - 💤 Snooze button to mute notifications
    - 📱 "Details" and "Snooze" action buttons

    ---

    ### ⚙️ Requirements
    - 🧩 **Integration:** `ha-njord`
    - 📲 Home Assistant Companion App (for actionable notifications)
    - 💾 An `input_text` helper (only if you enable Snooze) — create one under
      **Settings → Devices & Services → Helpers → Text**. Can be shared with
      other ha-njord blueprints.

    ---

    ✨ Created by **st0o0**

  input:
    weather_trend_sensor:
      name: "\U0001F327 Weather Trend Sensor"
      description: >
        The `ha-njord` weather trend sensor providing
        `precip_starts_in_hours` attribute
        (e.g. `sensor.home_weather_trend`).
      selector:
        entity:
          filter:
            domain: sensor
            integration: njord

    window_entities:
      name: "\U0001FA9F Window Sensors"
      description: >
        Binary sensors representing window open/closed state. State `on`
        means the window is open.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: true

    notify_target:
      name: "\U0001F4F1 Notify service"
      description: >
        The notification service/target to send alerts to
        (e.g. `notify.mobile_app_your_phone`).
      selector:
        text: {}

    threshold_section:
      name: "\U0001F4CF Thresholds"
      icon: mdi:tune
      collapsed: true
      input:
        precip_hours_threshold:
          name: Rain countdown threshold
          description: >
            Warn when rain is expected within this many hours.
          default: 2
          selector:
            number:
              min: 0.5
              max: 12
              step: 0.5
              unit_of_measurement: hours
              mode: slider

    actions_section:
      name: "\U0001F518 Notification actions"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        dashboard_path:
          name: Details dashboard path
          description: >
            Path opened by the "Details" button (e.g. `/lovelace/weather`).
            Leave empty to hide the Details button.
          default: ""
          selector:
            text: {}
        enable_snooze:
          name: Enable Snooze button
          description: Show a "Snooze" button that mutes notifications for a while.
          default: true
          selector:
            boolean: {}
        snooze_helper:
          name: Snooze storage helper
          description: >
            An `input_text` helper used to store snoozed keys. Required
            when Snooze is enabled. Can be shared with other ha-njord blueprints.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text
        snooze_hours:
          name: Snooze duration
          description: How many hours notifications stay muted after snooze.
          default: 4
          selector:
            number:
              min: 1
              max: 24
              step: 1
              unit_of_measurement: hours
              mode: slider

mode: parallel
max_exceeded: silent

triggers:
  - trigger: numeric_state
    entity_id: !input weather_trend_sensor
    attribute: precip_starts_in_hours
    below: !input precip_hours_threshold
    id: rain_approaching

variables:
  weather_trend_sensor: !input weather_trend_sensor
  window_entities: !input window_entities
  notify_target: !input notify_target
  precip_hours_threshold: !input precip_hours_threshold
  dashboard_path: !input dashboard_path
  enable_snooze: !input enable_snooze
  snooze_helper: !input snooze_helper
  snooze_hours: !input snooze_hours

  location: >-
    {{ (weather_trend_sensor | string).split('.')[1] | regex_replace('_weather_trend$', '') }}
  rain_key: "njord_rain_windows_{{ location }}"

  precip_h: "{{ state_attr(weather_trend_sensor, 'precip_starts_in_hours') | float(99) }}"

  open_windows: >-
    {% set ns = namespace(list=[]) %}
    {% for w in window_entities %}
      {% if states(w) == 'on' %}
        {% set ns.list = ns.list + [state_attr(w, 'friendly_name') | default(w, true)] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
  has_open_windows: "{{ open_windows | length > 0 }}"

  now_ts: "{{ as_timestamp(now()) }}"
  snooze_raw_state: "{{ (states(snooze_helper) | default('', true)) if (enable_snooze and snooze_helper | default('', true) | length > 0) else '' }}"
  snooze_pairs: >-
    {% set ns = namespace(list=[]) %}
    {% for entry in ((snooze_raw_state | string).split(';') if snooze_raw_state | length > 0 else []) %}
      {% if '=' in entry %}
        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}
  is_snoozed: >-
    {{ enable_snooze and (snooze_pairs | selectattr('key', 'eq', rain_key) | selectattr('ts', 'gt', now_ts) | list | length > 0) }}

  action_details: "URI"
  action_snooze: "{{ rain_key | upper }}_SNOOZE_{{ context.id }}"

actions:
  - if:
      - condition: template
        value_template: "{{ has_open_windows and not is_snoozed }}"
    then:
      - variables:
          notification_title: "🌧️ Rain in ~{{ precip_h | round(1) }}h — windows open!"
          notification_message: >-
            {{ open_windows | length }} windows open: {{ open_windows | join(', ') }}
          actions_list: >-
            {% set ns = namespace(list=[]) %}
            {% if dashboard_path | default('', true) | length > 0 %}
              {% set ns.list = ns.list + [{'action': action_details, 'title': 'Details', 'uri': dashboard_path}] %}
            {% endif %}
            {% if enable_snooze and snooze_helper | default('', true) | length > 0 %}
              {% set ns.list = ns.list + [{'action': action_snooze, 'title': 'Snooze ' ~ snooze_hours ~ 'h'}] %}
            {% endif %}
            {{ ns.list }}
      - action: "{{ notify_target }}"
        data:
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"
          data: >-
            {{ {
              'tag': rain_key,
              'actions': actions_list,
              'channel': 'njord_rain_warning',
              'importance': 'high',
              'priority': 'high',
            } }}
      - if:
          - condition: template
            value_template: "{{ enable_snooze and snooze_helper | default('', true) | length > 0 }}"
        then:
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_snooze }}"
            timeout:
              hours: 12
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.trigger is not none }}"
            then:
              - variables:
                  snooze_write_now_ts: "{{ as_timestamp(now()) }}"
                  snooze_write_raw_state: "{{ states(snooze_helper) | default('', true) }}"
                  snooze_write_pairs: >-
                    {% set ns = namespace(list=[]) %}
                    {% for entry in ((snooze_write_raw_state | string).split(';') if snooze_write_raw_state | length > 0 else []) %}
                      {% if '=' in entry %}
                        {% set ns.list = ns.list + [{'key': (entry | string).split('=')[0], 'ts': (entry | string).split('=')[1] | float(0)}] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.list }}
                  snooze_write_kept: >-
                    {% set ns = namespace(list=[]) %}
                    {% for p in snooze_write_pairs %}
                      {% if p.ts > snooze_write_now_ts and p.key != rain_key %}
                        {% set ns.list = ns.list + [p] %}
                      {% endif %}
                    {% endfor %}
                    {% set ns.list = ns.list + [{'key': rain_key, 'ts': snooze_write_now_ts + (snooze_hours | float(4) * 3600)}] %}
                    {{ ns.list }}
                  snooze_write_new_state: >-
                    {% set ns = namespace(parts=[]) %}
                    {% for p in snooze_write_kept %}
                      {% set ns.parts = ns.parts + [p.key ~ '=' ~ (p.ts | int)] %}
                    {% endfor %}
                    {{ ns.parts | join(';') }}
              - action: input_text.set_value
                target:
                  entity_id: "{{ snooze_helper }}"
                data:
                  value: "{{ snooze_write_new_state }}"
