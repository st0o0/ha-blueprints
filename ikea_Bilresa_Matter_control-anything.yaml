blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: st0o0
  domain: automation
  name: "IKEA Bilresa ⚙️ Controls"
  description: |
    ## ⚙️ IKEA BILRESA – Universal Remote Control for Home Assistant

    Assign **any Home Assistant action** to every scroll zone and button of the
    **IKEA BILRESA Smart Scroll Wheel** via Matter/Thread.
    Full flexibility for scroll, press, double press, and hold — perfect for
    lights, scenes, scripts, media players, or automations.

    ---

    ### 🧠 Features
    - 🎯 **Custom actions** for every event (scroll up/down, press, double press, hold)
    - 🔁 **Hold repeat** with adjustable delay and max loop count
    - 📡 **Two scroll modes:** Instant (per-click) or Relaxed (per-gesture)
    - 📊 **scroll_clicks variable** available in Relaxed mode for proportional actions

    ---

    ### 🎛️ Zone Layout

    | Zone | Scroll Up | Scroll Down | Button Click | Button Double | Button Hold |
    |:-----|:----------|:------------|:-------------|:-------------|:-----------|
    | 🔆 **Zone 1** | Custom | Custom | Custom | Custom | Custom (repeated) |
    | 🌡️ **Zone 2** | Custom | Custom | Custom | Custom | Custom (repeated) |
    | 🎨 **Zone 3** | Custom | Custom | Custom | Custom | Custom (repeated) |

    ---

    ### ⚙️ Compatibility
    - 🧩 **Integration:** Matter (`integration: matter`)
    - 🔧 **Scroll Mode:** Instant (sensor-based) or Relaxed (event-based)

    ---

    ### 📋 Setup Notes
    - **Instant mode:** Enable the 6 hidden scroll sensor entities in HA
    - **Relaxed mode:** Works immediately — `scroll_clicks` variable holds click count (1-8)
    - **Hold:** Button hold repeats action until release, respecting delay and max loops

    ---

    ✨ Created by **st0o0**
  input:
    bilresa_device:
      name: 📱 Bilresa Device
      description: >
        The IKEA BILRESA Smart Scroll Wheel paired via Matter/Thread.
      selector:
        device:
          filter:
            - integration: matter
              manufacturer: "IKEA of Sweden"
              model: "BILRESA scroll wheel"
    scroll_mode_section:
      name: 📡 Scroll mode
      icon: mdi:gesture-swipe
      collapsed: true
      input:
        scroll_mode:
          name: Scroll mode
          description: >
            **Instant** — Fires on every scroll click (scroll_clicks always 1).
            **Relaxed** — Fires after gesture completes (scroll_clicks = 1-8).
          default: instant
          selector:
            select:
              options:
                - label: "Instant (sensor-based)"
                  value: instant
                - label: "Relaxed (event-based)"
                  value: relaxed
              mode: dropdown
    ch1_scroll_up_action:
      name: 🔆 Zone 1 — Scroll Up
      description: Action(s) to run when Zone 1 is scrolled **up/right**. Variable `scroll_clicks` is available.
      default: []
      selector:
        action: {}
    ch1_scroll_down_action:
      name: 🔆 Zone 1 — Scroll Down
      description: Action(s) to run when Zone 1 is scrolled **down/left**. Variable `scroll_clicks` is available.
      default: []
      selector:
        action: {}
    ch2_scroll_up_action:
      name: 🌡️ Zone 2 — Scroll Up
      description: Action(s) to run when Zone 2 is scrolled **up/right**. Variable `scroll_clicks` is available.
      default: []
      selector:
        action: {}
    ch2_scroll_down_action:
      name: 🌡️ Zone 2 — Scroll Down
      description: Action(s) to run when Zone 2 is scrolled **down/left**. Variable `scroll_clicks` is available.
      default: []
      selector:
        action: {}
    ch3_scroll_up_action:
      name: 🎨 Zone 3 — Scroll Up
      description: Action(s) to run when Zone 3 is scrolled **up/right**. Variable `scroll_clicks` is available.
      default: []
      selector:
        action: {}
    ch3_scroll_down_action:
      name: 🎨 Zone 3 — Scroll Down
      description: Action(s) to run when Zone 3 is scrolled **down/left**. Variable `scroll_clicks` is available.
      default: []
      selector:
        action: {}
    ch1_press_action:
      name: 🔆 Zone 1 — Button Press
      description: Action(s) to run when Zone 1 button is **pressed**.
      default: []
      selector:
        action: {}
    ch2_press_action:
      name: 🌡️ Zone 2 — Button Press
      description: Action(s) to run when Zone 2 button is **pressed**.
      default: []
      selector:
        action: {}
    ch3_press_action:
      name: 🎨 Zone 3 — Button Press
      description: Action(s) to run when Zone 3 button is **pressed**.
      default: []
      selector:
        action: {}
    double_press_section:
      name: ⏩ Double press actions
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        ch1_double_press_action:
          name: 🔆 Zone 1 — Double Press
          description: Action(s) to run when Zone 1 button is **pressed twice**.
          default: []
          selector:
            action: {}
        ch2_double_press_action:
          name: 🌡️ Zone 2 — Double Press
          description: Action(s) to run when Zone 2 button is **pressed twice**.
          default: []
          selector:
            action: {}
        ch3_double_press_action:
          name: 🎨 Zone 3 — Double Press
          description: Action(s) to run when Zone 3 button is **pressed twice**.
          default: []
          selector:
            action: {}
    hold_section:
      name: ✊ Hold actions
      icon: mdi:gesture-tap-hold
      collapsed: true
      input:
        ch1_hold_action:
          name: 🔆 Zone 1 — Hold
          description: Action(s) to run repeatedly when Zone 1 button is **held**.
          default: []
          selector:
            action: {}
        ch2_hold_action:
          name: 🌡️ Zone 2 — Hold
          description: Action(s) to run repeatedly when Zone 2 button is **held**.
          default: []
          selector:
            action: {}
        ch3_hold_action:
          name: 🎨 Zone 3 — Hold
          description: Action(s) to run repeatedly when Zone 3 button is **held**.
          default: []
          selector:
            action: {}
    options_section:
      name: ⏱️ Timing
      icon: mdi:timer-cog
      collapsed: true
      input:
        helper_hold_delay:
          name: Hold delay
          description: >
            Time between repeated actions while a button is held down.
            Lower values give faster response, higher values give more control.
          default: 250
          selector:
            number:
              unit_of_measurement: milliseconds
              min: 100.0
              max: 5000.0
              step: 10.0
              mode: slider
        helper_max_loops:
          name: Max hold loops
          description: >
            Maximum number of action repetitions while holding a button.
            Prevents infinite loops if button release is not detected.
          default: 20
          selector:
            number:
              min: 1.0
              max: 1000.0
              step: 1.0
              mode: slider
mode: single
max_exceeded: silent
trigger_variables:
  var_device_id: !input bilresa_device
  var_scroll_mode: !input scroll_mode
  var_sensor_ch1_up: "{{ device_entities(var_device_id) | select('match', '^sensor\\..+_1$') | first | default('') }}"
  var_sensor_ch1_down: "{{ device_entities(var_device_id) | select('match', '^sensor\\..+_2$') | first | default('') }}"
  var_sensor_ch2_up: "{{ device_entities(var_device_id) | select('match', '^sensor\\..+_4$') | first | default('') }}"
  var_sensor_ch2_down: "{{ device_entities(var_device_id) | select('match', '^sensor\\..+_5$') | first | default('') }}"
  var_sensor_ch3_up: "{{ device_entities(var_device_id) | select('match', '^sensor\\..+_7$') | first | default('') }}"
  var_sensor_ch3_down: "{{ device_entities(var_device_id) | select('match', '^sensor\\..+_8$') | first | default('') }}"
  var_event_ch1_up: "{{ device_entities(var_device_id) | select('match', '^event\\..+_1$') | first | default('') }}"
  var_event_ch1_down: "{{ device_entities(var_device_id) | select('match', '^event\\..+_2$') | first | default('') }}"
  var_event_ch2_up: "{{ device_entities(var_device_id) | select('match', '^event\\..+_4$') | first | default('') }}"
  var_event_ch2_down: "{{ device_entities(var_device_id) | select('match', '^event\\..+_5$') | first | default('') }}"
  var_event_ch3_up: "{{ device_entities(var_device_id) | select('match', '^event\\..+_7$') | first | default('') }}"
  var_event_ch3_down: "{{ device_entities(var_device_id) | select('match', '^event\\..+_8$') | first | default('') }}"
  var_btn_ch1: "{{ device_entities(var_device_id) | select('match', '^event\\..+_3$') | first | default('') }}"
  var_btn_ch2: "{{ device_entities(var_device_id) | select('match', '^event\\..+_6$') | first | default('') }}"
  var_btn_ch3: "{{ device_entities(var_device_id) | select('match', '^event\\..+_9$') | first | default('') }}"
triggers:
  # Instant mode: sensor state changes
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_sensor_ch1_up }}"
    id: instant-ch1-up
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_sensor_ch1_down }}"
    id: instant-ch1-down
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_sensor_ch2_up }}"
    id: instant-ch2-up
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_sensor_ch2_down }}"
    id: instant-ch2-down
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_sensor_ch3_up }}"
    id: instant-ch3-up
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_sensor_ch3_down }}"
    id: instant-ch3-down
  # Relaxed mode: event entity state changes
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_event_ch1_up }}"
    id: relaxed-ch1-up
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_event_ch1_down }}"
    id: relaxed-ch1-down
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_event_ch2_up }}"
    id: relaxed-ch2-up
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_event_ch2_down }}"
    id: relaxed-ch2-down
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_event_ch3_up }}"
    id: relaxed-ch3-up
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_event_ch3_down }}"
    id: relaxed-ch3-down
  # Buttons (always active)
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_btn_ch1 }}"
    id: btn-ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_btn_ch2 }}"
    id: btn-ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_btn_ch3 }}"
    id: btn-ch3
condition:
  - condition: template
    value_template: >-
      {% set t = trigger.event.data %}
      {% set is_btn = (trigger.id | string).startswith('btn-') %}
      {% set is_instant = (trigger.id | string).startswith('instant-') %}
      {% set is_relaxed = (trigger.id | string).startswith('relaxed-') %}
      {{
        t.old_state is not none and
        t.new_state is not none and
        (t.new_state.state | string) not in ['unknown', 'unavailable'] and
        (t.old_state.state | string) not in ['unknown', 'unavailable'] and
        (
          is_btn or
          (is_instant and var_scroll_mode == 'instant') or
          (is_relaxed and var_scroll_mode == 'relaxed')
        )
      }}
variables:
  scroll_clicks: >-
    {% if (trigger.id | string).startswith('instant-') %}
      1
    {% else %}
      {{ trigger.event.data.new_state.attributes.totalNumberOfPressesCounted | default(1) | int(1) }}
    {% endif %}
  btn_entity: "{{ trigger.event.data.entity_id | default('') }}"
actions:
  - choose:
      # --- Scroll actions ---
      - conditions:
          - condition: trigger
            id:
              - instant-ch1-up
              - relaxed-ch1-up
        sequence:
          - choose: []
            default: !input ch1_scroll_up_action
          - delay:
              milliseconds: 50
      - conditions:
          - condition: trigger
            id:
              - instant-ch1-down
              - relaxed-ch1-down
        sequence:
          - choose: []
            default: !input ch1_scroll_down_action
          - delay:
              milliseconds: 50
      - conditions:
          - condition: trigger
            id:
              - instant-ch2-up
              - relaxed-ch2-up
        sequence:
          - choose: []
            default: !input ch2_scroll_up_action
          - delay:
              milliseconds: 50
      - conditions:
          - condition: trigger
            id:
              - instant-ch2-down
              - relaxed-ch2-down
        sequence:
          - choose: []
            default: !input ch2_scroll_down_action
          - delay:
              milliseconds: 50
      - conditions:
          - condition: trigger
            id:
              - instant-ch3-up
              - relaxed-ch3-up
        sequence:
          - choose: []
            default: !input ch3_scroll_up_action
          - delay:
              milliseconds: 50
      - conditions:
          - condition: trigger
            id:
              - instant-ch3-down
              - relaxed-ch3-down
        sequence:
          - choose: []
            default: !input ch3_scroll_down_action
          - delay:
              milliseconds: 50
      # --- Button CH1 ---
      - conditions:
          - condition: trigger
            id: btn-ch1
        sequence:
          - variables:
              btn_event_type: "{{ trigger.event.data.new_state.attributes.event_type | default('') }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'multi_press_1' }}"
                sequence:
                  - choose: []
                    default: !input ch1_press_action
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'multi_press_2' }}"
                sequence:
                  - choose: []
                    default: !input ch1_double_press_action
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'long_press' }}"
                sequence:
                  - repeat:
                      count: !input helper_max_loops
                      sequence:
                        - if:
                            - condition: template
                              value_template: "{{ state_attr(btn_entity, 'event_type') | default('') != 'long_press' }}"
                          then:
                            - stop: "button released"
                        - choose: []
                          default: !input ch1_hold_action
                        - delay:
                            milliseconds: !input helper_hold_delay
      # --- Button CH2 ---
      - conditions:
          - condition: trigger
            id: btn-ch2
        sequence:
          - variables:
              btn_event_type: "{{ trigger.event.data.new_state.attributes.event_type | default('') }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'multi_press_1' }}"
                sequence:
                  - choose: []
                    default: !input ch2_press_action
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'multi_press_2' }}"
                sequence:
                  - choose: []
                    default: !input ch2_double_press_action
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'long_press' }}"
                sequence:
                  - repeat:
                      count: !input helper_max_loops
                      sequence:
                        - if:
                            - condition: template
                              value_template: "{{ state_attr(btn_entity, 'event_type') | default('') != 'long_press' }}"
                          then:
                            - stop: "button released"
                        - choose: []
                          default: !input ch2_hold_action
                        - delay:
                            milliseconds: !input helper_hold_delay
      # --- Button CH3 ---
      - conditions:
          - condition: trigger
            id: btn-ch3
        sequence:
          - variables:
              btn_event_type: "{{ trigger.event.data.new_state.attributes.event_type | default('') }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'multi_press_1' }}"
                sequence:
                  - choose: []
                    default: !input ch3_press_action
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'multi_press_2' }}"
                sequence:
                  - choose: []
                    default: !input ch3_double_press_action
              - conditions:
                  - condition: template
                    value_template: "{{ btn_event_type == 'long_press' }}"
                sequence:
                  - repeat:
                      count: !input helper_max_loops
                      sequence:
                        - if:
                            - condition: template
                              value_template: "{{ state_attr(btn_entity, 'event_type') | default('') != 'long_press' }}"
                          then:
                            - stop: "button released"
                        - choose: []
                          default: !input ch3_hold_action
                        - delay:
                            milliseconds: !input helper_hold_delay
