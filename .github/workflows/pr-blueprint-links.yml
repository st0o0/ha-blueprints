name: Blueprint Import Links

on:
  pull_request:
    branches: [main]
    paths:
      - "*.yaml"

jobs:
  post-links:
    name: Post HA Import Links
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Get changed YAML files
        id: changed
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          files=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.yaml')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate comment body
        if: steps.changed.outputs.files != ''
        id: comment
        shell: bash
        run: |
          repo="${{ github.repository }}"
          branch="${{ github.head_ref }}"
          body_file=$(mktemp)

          echo "## 🏠 Blueprint Import Links" >> "$body_file"
          echo "" >> "$body_file"
          echo "Test these blueprints directly in your Home Assistant instance:" >> "$body_file"
          echo "" >> "$body_file"
          echo "| Blueprint | Import | Source |" >> "$body_file"
          echo "|:----------|:------:|:------:|" >> "$body_file"

          while IFS= read -r file; do
            [ -f "$file" ] || continue

            name=$(yq eval '.blueprint.name // ""' "$file")
            [ -z "$name" ] && continue

            raw_url="https://raw.githubusercontent.com/${repo}/${branch}/${file}"
            encoded_url=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$raw_url")
            import_url="https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=${encoded_url}"

            echo "| **${name}** | [![Import](https://my.home-assistant.io/badges/blueprint_import.svg)](${import_url}) | [YAML](${raw_url}) |" >> "$body_file"
          done <<< "${{ steps.changed.outputs.files }}"

          echo "" >> "$body_file"
          echo "> ⚠️ Links point to the **PR branch** (\`${branch}\`), not \`main\`." >> "$body_file"

          {
            echo "body<<ENDOFBODY"
            cat "$body_file"
            echo "ENDOFBODY"
          } >> "$GITHUB_OUTPUT"

          rm -f "$body_file"

      - name: Find existing comment
        if: steps.changed.outputs.files != ''
        uses: peter-evans/find-comment@v3
        id: find
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## 🏠 Blueprint Import Links"

      - name: Create or update comment
        if: steps.changed.outputs.files != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          edit-mode: replace
          body: ${{ steps.comment.outputs.body }}
