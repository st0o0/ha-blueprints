name: Blueprint Import Links

on:
  pull_request:
    branches: [main]
    paths:
      - "*.yaml"

jobs:
  post-links:
    name: Post HA Import Links
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Generate comment body
        id: comment
        shell: bash
        run: |
          repo="${{ github.repository }}"
          branch="${{ github.head_ref }}"
          body_file=$(mktemp)

          echo "## 🏠 Blueprint Import Links" >> "$body_file"
          echo "" >> "$body_file"
          echo "Test these blueprints directly in your Home Assistant instance:" >> "$body_file"
          echo "" >> "$body_file"

          for file in *.yaml; do
            [ -f "$file" ] || continue

            name=$(yq eval '.blueprint.name // ""' "$file")
            [ -z "$name" ] && continue

            raw_url="https://raw.githubusercontent.com/${repo}/${branch}/${file}"
            encoded_url=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$raw_url")
            import_url="https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=${encoded_url}"

            echo "### ${name}" >> "$body_file"
            echo "" >> "$body_file"
            echo "[![Import Blueprint](https://my.home-assistant.io/badges/blueprint_import.svg)](${import_url})" >> "$body_file"
            echo "" >> "$body_file"
            echo "<details><summary>📋 Manual import URL</summary>" >> "$body_file"
            echo "" >> "$body_file"
            echo "\`\`\`" >> "$body_file"
            echo "${raw_url}" >> "$body_file"
            echo "\`\`\`" >> "$body_file"
            echo "</details>" >> "$body_file"
            echo "" >> "$body_file"
          done

          echo "---" >> "$body_file"
          echo "⚠️ These links point to the **PR branch** (\`${branch}\`), not \`main\`." >> "$body_file"

          {
            echo "body<<ENDOFBODY"
            cat "$body_file"
            echo "ENDOFBODY"
          } >> "$GITHUB_OUTPUT"

          rm -f "$body_file"

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## 🏠 Blueprint Import Links"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          edit-mode: replace
          body: ${{ steps.comment.outputs.body }}
