name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    name: Publish Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Generate import links
        id: links
        shell: bash
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          repo="${{ github.repository }}"
          body=""

          body+=$'\n## Blueprints\n\n'
          body+="| Blueprint | Import |"$'\n'
          body+="|:----------|:------:|"$'\n'

          for file in *.yaml; do
            [ -f "$file" ] || continue
            name=$(yq '.blueprint.name' "$file")
            url="https://github.com/${repo}/blob/${tag}/${file}"
            encoded_url=$(printf '%s' "$url" | jq -sRr @uri)
            import_url="https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=${encoded_url}"

            body+="| **${name}** | [![Import](https://my.home-assistant.io/badges/blueprint_import.svg)](${import_url}) |"$'\n'
          done

          # Write to file to preserve newlines
          echo "$body" > release-body.md

      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          existing=$(gh release view "$tag" --json body -q .body)
          combined="${existing}"$'\n'"$(cat release-body.md)"
          gh release edit "$tag" --notes "$combined"
